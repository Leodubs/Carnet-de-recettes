{id:"carbonara-ail-confit", cat:"sale", name:"Pâtes carbonara à l'ail confit", time:"45 min", parts:"3", origin:"@charlie.ma.vie", desc:"Des carbonara revisitées à ma façon avec de l'ail confit — ce sont les meilleures, je veux rien savoir.", ingredients:["500 g de pâtes","1 tête d'ail","80 g de parmesan","6 g de persil ciselé","30 g de beurre mou","3 jaunes d'œufs","250 g de lard fumé (ou du guanciale)","1 pincée de poivre"], steps:["Couper le chapeau de la tête d'ail, la mettre dans une mini cocotte ou en papillote (enveloppée dans du papier cuisson) avec une pincée de sel et un filet d'huile. Cuisson 35 min à 200°C.","Dans un saladier, ajouter le parmesan, le persil, le beurre et les jaunes d'œufs.","Couper les tranches de lard en morceaux et les faire cuire à la poêle jusqu'à ce qu'ils soient bien grillés. Verser un peu du gras dans la sauce, ça va la rendre davantage onctueuse.","Mixer les morceaux de lard, les ajouter à la sauce.","Presser la tête d'ail, écraser la chair et l'ajouter aussi.","Bien mélanger, sans oublier l'eau de cuisson des pâtes. On termine par les pâtes et c'est déjà prêt !"]},

{id:"mealprep-poulet-tomate", cat:"sale", name:"Poulet à la tomate (meal prep en sachet)", time:"10 min de préparation + congélation", parts:"3 portions", origin:"@coco_est_en_cuisine", desc:"3 meal prep = 3 repas du soir pour la semaine, à préparer à l'avance et à congeler en sachet. Ici, la version poulet-tomate.", ingredients:["400 g de poulet","200 g de champignons","100 g de poivrons & oignons rouges","400 g de tomates concassées","1 c. à café de paprika fumé","Ail en poudre","1 c. à soupe d'huile d'olive"], steps:["Mettre tous les ingrédients dans le sachet, mélanger, fermer et direction le congélateur.","Le matin : sachet au réfrigérateur pour décongeler tranquillement.","Le soir : verser dans une sauteuse et faire cuire, avec l'accompagnement de votre choix (riz, pâtes, semoule…)."]},
{id:"mealprep-poulet-moutarde", cat:"sale", name:"Poulet moutarde, courgettes & champignons (meal prep en sachet)", time:"10 min de préparation + congélation", parts:"3 portions", origin:"@coco_est_en_cuisine", desc:"3 meal prep = 3 repas du soir pour la semaine, à préparer à l'avance et à congeler en sachet. Ici, la version poulet-moutarde.", ingredients:["400 g de poulet, laissés entiers","1 grosse courgette (300 g)","200 g de champignons","1 à 2 c. à soupe de moutarde","Herbes de Provence","1 c. à soupe d'huile","Sel & poivre"], steps:["Mettre tous les ingrédients dans le sachet, mélanger, fermer et direction le congélateur.","Le matin : sachet au réfrigérateur pour décongeler tranquillement.","Le soir : verser dans une sauteuse et faire cuire, avec l'accompagnement de votre choix (riz, pâtes, semoule…)."]},
{id:"mealprep-boeuf-asiatique", cat:"sale", name:"Bœuf asiatique (meal prep en sachet)", time:"10 min de préparation + congélation", parts:"3 portions", origin:"@coco_est_en_cuisine", desc:"3 meal prep = 3 repas du soir pour la semaine, à préparer à l'avance et à congeler en sachet. Ici, la version bœuf asiatique.", ingredients:["400 g de rumsteck en fines lamelles","200 g de carottes","200 g de pousses de soja & brocolis","1 c. à soupe de miel","2 c. à soupe de sauce soja","1 c. à café d'huile de sésame","Gingembre & ail en poudre"], steps:["Mettre tous les ingrédients dans le sachet, mélanger, fermer et direction le congélateur.","Le matin : sachet au réfrigérateur pour décongeler tranquillement.","Le soir : faire d'abord cuire les légumes environ 10 min, puis ajouter le bœuf et poursuivre la cuisson jusqu'à ce qu'il soit cuit à cœur. Ajouter un peu d'eau en fin de cuisson pour obtenir davantage de bouillon."], tip:"Servir avec des nouilles de riz."},
{id:"egg-sando-proteine", cat:"sale", name:"Egg sando protéiné (petit-déjeuner)", time:"15 min", parts:"1", origin:"@seattlehanddoc", desc:"Mon nouvelle façon préférée de faire un egg sando rapide et facile, 35 g de protéines par sandwich (70 g si on mange toute la recette).", ingredients:["2 tranches de pain","4 œufs","1 pincée de sel","Ciboulette ou oignons verts hachés","1 trait d'eau","Beurre","4 tranches de fromage Muenster","4 tranches de dinde (ou jambon, bacon, poulet…)","Quelques tranches de tomate","Huile de chili à l'ail (chili crisp)"], steps:["Couper le pain en diagonale pour obtenir 4 triangles.","Beurrer une poêle antiadhésive.","Disposer les triangles de pain pointes vers le centre, en laissant un petit canal en croix d'environ 2 cm entre chaque pièce. Le dessus du pain doit rester sec.","Fouetter les œufs avec le sel, la ciboulette et un trait d'eau pour les fluidifier un peu, afin qu'ils s'écoulent facilement entre les tranches.","Garder le feu DOUX : verser lentement le mélange d'œufs dans les canaux ouverts pour qu'il s'écoule au centre et autour du pain, formant une base d'œuf connectée. Ne pas verser sur le pain.","Couvrir avec un couvercle et cuire à feu doux jusqu'à ce que les œufs soient complètement pris. Le couvercle aide à une cuisson homogène, le feu doux évite le brunissement.","Retourner délicatement le tout.","Garnir chaque triangle de pain d'un triangle de Muenster, d'une pièce de dinde, de tranches de tomate et d'un filet d'huile de chili à l'ail.","Plier le sandwich en deux et laisser cuire encore une minute, jusqu'à ce que le fromage soit parfaitement fondant."], tip:"À personnaliser : fromage, protéine, légumes ou sauce au choix."},
{id:"tomates-cerises-lacto", cat:"sansgluten", name:"Tomates cerises lacto-fermentées", time:"5 à 7 jours de fermentation", parts:"1 bocal", origin:"@salomelafermentee", desc:"Mieux que la stérilisation ou la congélation : pas de cuisson (vitamines, enzymes et couleurs intactes), pas de congélateur, c'est vivant et zéro déchet. Ces tomates deviennent légèrement acidulées, pleines de caractère, parfaites dans une salade, sur une tartine ou en antipasti.", ingredients:["Des tomates cerises","Quelques gousses d'ail","Des herbes","30 g de sel / litre d'eau non chlorée (saumure à 3 %)"], steps:["Remplir un bocal de tomates cerises lavées, ajouter quelques gousses d'ail et des herbes.","Recouvrir avec une saumure à 3 % (30 g de sel / litre d'eau non chlorée).","Fermer et laisser fermenter à température ambiante 5 à 7 jours (ou plus selon ton goût).","Mettre ensuite au frais pour ralentir la fermentation."], tip:"La fermentation produit de l'acide lactique : le pH baisse, ce qui préserve les vitamines, enrichit le microbiote et booste l'immunité."},
{id:"sauce-tomate-lacto", cat:"sansgluten", name:"Sauce tomate lacto-fermentée", time:"3 à 4 jours de fermentation", parts:"Plusieurs bocaux", origin:"@lucie__green", desc:"Ma méthode préférée pour conserver les tomates : naturellement sûre, très simple, sans cuisson ni stérilisation, et elle développe des arômes incroyables.", ingredients:["3,5 kg de tomates bien mûres","35 g minimum de sel non traité et non iodé (1 % du poids des tomates, jusqu'à 3 % selon le résultat recherché)","Facultatif : basilic, ail, thym…"], steps:["Mixer les tomates.","Ajouter le sel.","Remplir les bocaux en laissant 2 à 3 cm sous le bord.","Fermer.","Laisser fermenter 3 à 4 jours à température ambiante, puis placer les bocaux dans un endroit frais (une cave, un cellier…)."], tip:"Parfaite pour les pizzas, les pâtes, les lasagnes ou toutes les recettes à base de tomate. Le pH qui baisse progressivement empêche le développement des bactéries responsables du botulisme."},
{id:"rice-paper-dumplings", cat:"sale", name:"Rice paper dumplings", time:"25 min", parts:"2 à 3", origin:"@broccoli_mum", desc:"Vegan et sans huile : croustillants dehors, juteux dedans, et bourrés de légumes. Des dumplings maison simples et rassasiants, parfaits pour un comfort food healthy.", ingredients:["Champignons","Courgette","Carotte","Chou","Tofu","Feuilles de papier de riz","Sauce soja","Vinaigre de riz","Ail en poudre","Sauce chili sucrée","Graines de sésame"], steps:["Mettre les champignons, la courgette, la carotte, le chou et le tofu dans un robot et mixer jusqu'à obtenir une fine chapelure de légumes.","Transférer le mélange dans une poêle antiadhésive. Ajouter la sauce soja et l'ail en poudre, puis cuire quelques minutes jusqu'à ce que les légumes ramollissent.","Tremper une feuille de papier de riz dans l'eau jusqu'à ce qu'elle ramollisse.","Déposer un peu de farce au centre et replier en petit colis bien scellé.","Parsemer des graines de sésame dans une poêle antiadhésive et cuire les dumplings dessus jusqu'à ce qu'ils soient dorés et croustillants des deux côtés.","Mélanger la sauce soja, le vinaigre de riz et la sauce chili sucrée pour une sauce à tremper rapide.","Servir les dumplings avec la sauce à tremper."]},
{id:"burratas-panees", cat:"sale", name:"Mini burratas panées", time:"15 min + 30 à 45 min au congélateur", parts:"3 mini burratas", origin:"@laurenbouffe", desc:"Des mini burratas panées croustillantes avec un cœur bien coulant, cuites à l'Airfryer.", ingredients:["3 mini burratas (40 à 50 g chacune) ou 6 petites billes de mozza","30 g de farine","1 œuf battu","50 g de chapelure panko (ou chapelure classique)","15 g de parmesan râpé (facultatif)","1 pincée d'ail en poudre","Quelques sprays d'huile d'olive","Poivre"], steps:["Égoutter et sécher soigneusement les billes de burrata avec du papier absorbant.","Les placer 30 à 45 minutes au congélateur, juste le temps qu'elles raffermissent.","Préparer trois bols : farine, œuf battu, puis panko mélangé au parmesan et à l'ail en poudre.","Paner chaque bille en passant successivement dans la farine, l'œuf, la chapilure, puis une seconde fois dans l'œuf et la chapelure pour une double panure bien croustillante.","Vaporiser légèrement d'huile d'olive.","Cuire 5 à 6 minutes à l'Airfryer à 190°C. Pour un cœur bien coulant, ne pas dépasser 6 minutes et laisser reposer seulement 30 secondes avant de servir."], tip:"C'est délicieux avec un filet de miel, du pesto de pistache ou quelques tomates cerises rôties. Sur une salade, miam !"},
{id:"cordons-bleus-maison", cat:"sale", name:"Cordons bleus maison (2 par filet)", time:"30 min", parts:"2 cordons bleus par filet", origin:"@nabil_zemmouri", desc:"L'astuce anti-gaspi et économique : ne faites pas d'un filet un seul cordon bleu, mais bien deux. Avec un grand couteau, diviser le filet, l'ouvrir en porte-feuille et l'aplatir finement.", ingredients:["Des filets de volaille","Du jambon","Du fromage (Saint-Nectaire fermier, ou comté, scamorza, morbier, brie, pont-l'évêque)","Farine, œuf battu et chapilure pour la panure","Beurre + huile d'olive"], steps:["Congeler les filets 30 à 40 min pour les paner plus facilement (on peut aussi les laisser congelés quelques jours, prêts à être panés).","Avec un grand couteau, diviser chaque filet en 2.","Ouvrir chaque moitié en porte-feuille, puis aplatir finement avec le dessous d'une casserole, en protégeant bien la volaille d'un film alimentaire (sinon vous allez la déchiqueter et la trouer).","Y mettre enfin jambon et fromage — attention à ne pas saler si le jambon et le fromage le sont déjà.","Cuire 5 minutes par face (10 min en tout) à feu moyen-doux, toujours dans un mélange de beurre et d'huile d'olive : c'est ce qui laisse le temps au fromage de fondre."], tip:"Le Saint-Nectaire fermier est mon fromage préféré, mais un comté, une scamorza, du morbier, du brie ou même du pont-l'évêque font l'affaire."},
{id:"onigiri-jaune-confit", cat:"sale", name:"Onigiri jaune d'œuf confit", time:"24 h de marinade + montage", parts:"6 onigiri", origin:"@yumiaouss", desc:"Le best des onigiri 7-Eleven way : jaune d'œuf confit mariné à la sauce soja, riz à sushi et algue nori.", ingredients:["6 jaunes d'œufs","De la sauce soja","Du riz à sushi","Des algues nori"], steps:["Dans un plat, placer délicatement les jaunes d'œufs dans de la sauce soja, les arroser à l'aide d'une cuillère.","Couvrir et placer au frigo pendant 24 h (arroser de temps en temps les jaunes d'œufs — personnellement je le fais 3-4 fois en tout).","Monter les onigiri avec le riz à sushi, une feuille d'algue nori et un jaune d'œuf confit."], tip:"Facile non ?"},
{id:"sauce-tahini-citron", cat:"sale", name:"Sauce tahini-citron (Ta Diète Ep. 30)", time:"5 min", parts:"~500 ml", origin:"@swiss.fitcook", desc:"Crémeuse, au tahini, citron et balsamique : elle va sur le poulet, le bœuf, les légumes grillés, les patates… ou tout ce qui mérite un peu plus de gourmandise.", ingredients:["300 g de yaourt grec 0 % (ou skyr)","70 g de tahini","Le zeste + le jus d'1/2 citron","1 c. à soupe de vinaigre balsamique","1 grosse gousse d'ail","1 c. à café de thym","1/2 c. à café de cumin moulu","5 g de sirop d'agave","Sel et poivre","20 à 40 ml d'eau froide"], steps:["Mettre tout dans le blender et mixer jusqu'à texture lisse et crémeuse.","Ajuster avec 20-40 ml d'eau froide jusqu'à une sauce bien nappante.","Goûter, rectifier le sel, le poivre ou le citron, et préparer à tremper absolument tout dedans."], tip:"Valeurs nutritionnelles par portion (30 g) : 41 kcal, 2,7 g de protéines."},
{id:"flan-cheesecake-abricot", cat:"sucre", name:"Flan-cheesecake abricot-pistache", time:"50 min + 2 h au frais", parts:"6", origin:"@laurenbouffe", desc:"Un absolu banger de l'été : frais, léger, acidulé avec les abricots cuits — le dessert que je fais mille fois par saison.", ingredients:["3 œufs","2 à 3 c. à soupe de miel (env. 50 g)","1 c. à soupe d'extrait de vanille ou de la poudre de vanille (mieux encore : l'intérieur d'une demi-gousse)","2 c. à soupe de Maïzena (30 g)","500 g de fromage blanc","6 à 8 abricots mûrs","Une petite poignée de pistaches concassées"], steps:["Préchauffer le four à 180°C.","Dans un petit bol, délayer la Maïzena dans 2 à 3 c. à soupe d'eau froide (l'eau froide dissout bien la fécule et évite les grumeaux).","Dans un saladier, battre les œufs avec le miel et la vanille. Ajouter ensuite la Maïzena délayée, en fouettant bien pour homogénéiser.","Dans un second saladier, verser le fromage blanc. Incorporer petit à petit le mélange aux œufs, en remuant doucement pour obtenir une texture lisse et bien liée.","Tapisser un moule de 20 cm de papier cuisson. Verser la préparation dans le moule.","Couper les abricots en deux, les dénoyauter et les déposer délicatement sur le dessus, face coupée vers le bas. Parsemer de pistaches concassées.","Enfourner pour 35 à 40 minutes : le flan doit être pris sur les bords, encore légèrement tremblotant au centre. Laisser tiédir puis réfrigérer au moins 2 heures avant de déguster bien frais."], tip:"J'aime bien badigeonner les abricots d'un petit peu de confiture (idéalement abricot) avant de servir, histoire de les rendre brillants."},
{id:"mousse-avocat", cat:"sansgluten", name:"Mousse d'avocat", time:"10 min", parts:"4 à 6", origin:"@not_so_superflu", desc:"La mousse d'avocat qui se marie avec tout : parfaite pour les apéros ou pour accompagner des crudités, du saumon fumé, des œufs durs, des salades ou simplement sur des tartines.", ingredients:["2 avocats","2 grosses cuillères à soupe de yaourt à la grecque","Le jus d'1 citron vert","Environ 150 g de feta","1 grosse poignée de roquette","Une dizaine de feuilles de basilic frais","2 cuillères à soupe d'huile d'olive","1 pincée de sel","Poivre","Quelques flocons de piment (facultatif)"], steps:["Mixer tous les ingrédients ensemble jusqu'à obtenir une mousse lisse et crémeuse.","Rectifier l'assaisonnement et servir bien frais."], tip:"Légende sans déroulé : ingrédients seuls, étapes minimales."},
{id:"ajo-blanco", cat:"sansgluten", name:"Ajo blanco (au mortier)", time:"25 min + 2 h au frais", parts:"4", origin:"@kitchen.on.the.roof", desc:"L'ancêtre blanc du gazpacho, le « père » de tous les gazpachos. Il ne se mixe pas, il s'apprivoise au pilon — c'est le vrai goût de l'Andalousie.", ingredients:["150 g de pain rassis de la veille","100 g d'amandes mondées","1 petite gousse d'ail (germe retiré — l'élégance est dans la subtilité)","100 ml d'huile d'olive extra vierge","1 petite pincée de gros sel","2 c. à soupe de vinaigre de xérès","60 cl d'eau glacée","Quelques grains de raisin et un trait d'huile d'olive (dressage)"], steps:["L'imprégnation : déchirer le pain, le noyer dans un peu d'eau et le laisser s'oublier 15 min.","Le broyage : dans le mortier, écraser l'ail et le sel (qui sert d'abrasif), puis ajouter progressivement les amandes jusqu'à obtenir une pâte crémeuse.","L'alchimie : intégrer petit à petit le pain légèrement essoré et travailler la matière.","L'émulsion : verser l'huile en filet, comme pour une mayonnaise, avec un geste circulaire.","Le final : allonger avec le vinaigre et l'eau froide progressivement. Le résultat doit napper légèrement une cuillère.","Laisser reposer 2 h au réfrigérateur et servir glacé, avec trois grains de raisin pour le contraste sucré-acide et un trait d'huile d'olive."], tip:"Avant que la tomate n'arrive des Amériques au XVIe siècle, la péninsule ibérique savourait déjà cette merveille."},
{id:"mayonnaise-traditionnelle", cat:"sansgluten", name:"Mayonnaise traditionnelle", time:"10 min", parts:"1 bol", origin:"@happycook.fr", desc:"Seulement trois ingrédients, un bon coup de main… et pas de précipitation. La vraie, celle de toujours.", ingredients:["1 jaune d'œuf","150 ml d'huile d'olive","Une pincée de sel"], steps:["Placer le jaune d'œuf dans un mortier avec le sel et commencer à le travailler doucement.","Ajouter l'huile petit à petit, en filet fin et constant, sans arrêter de mélanger.","Sans se presser, avec un rythme régulier et un geste ferme : en quelques minutes, l'émulsion se forme et se transforme en une mayonnaise dense, brillante et parfaitement liée."]},
{id:"sauce-ail-herbes", cat:"sansgluten", name:"Sauce ail & herbes", time:"5 min", parts:"1 bol", origin:"@happycook.fr", desc:"La sauce ail & herbes façon toum, parfaite pour accompagner grillades et crudités.", ingredients:["1 verre d'huile de colza ou de pépin de raisin","½ verre de lait demi-écrémé","3 gousses d'ail","Persil plat","40 g de parmesan","Sel et poivre du moulin"], steps:["Mixer tous les ingrédients jusqu'à obtenir une sauce lisse, dense et crémeuse."], tip:"Légende sans déroulé : ingrédients seuls, étapes minimales. Coquille corrigée : « 1/2 de lait » → ½ verre de lait."},
{id:"lemon-cookies", cat:"sucre", name:"Lemon cookies (anti-gaspi)", time:"40 min", parts:"Une douzaine", origin:"@cookingwithbello", desc:"Stop au gaspillage des restes de citron ! Deux options : version sablée (citron bouilli + sucre, huile et farine) ou version chewy avec 2 œufs — pour un goût citron plus fort, remplacer un œuf par 60 ml de jus de citron.", ingredients:["1 citron (restes d'épluchures)","200 g de sucre","85 g d'huile d'olive","280 g de farine","1 c. à café de levure chimique","1 pincée de sel","Facultatif : 2 œufs (ou 1 œuf + 60 ml de jus de citron)"], steps:["Faire bouillir le citron 15 min, puis le mixer avec le sucre et l'huile (c'est le moment d'ajouter les 2 œufs, ou 1 œuf et le jus de citron, pour la version chewy).","Ajouter la farine, la levure et la pincée de sel.","Former des cookies, les rouler dans du sucre glace et cuire 15-20 min à 180°C, jusqu'à ce qu'ils soient dorés."], tip:"Merci à @ilgolosomangiaresano pour l'idée."},
{id:"thon-conserve-maison", cat:"sansgluten", name:"Thon en conserve maison", time:"45 min (+ stérilisation 1 h 30)", parts:"2 bocaux de 250 ml", origin:"@happycook.fr", desc:"Du thon poché au bouillon vinaigré puis mis en bocal, bien meilleur que celui du commerce.", ingredients:["500 à 600 g de darnes de thon (en 2 ou 3 morceaux)","500 ml d'eau","100 ml de vinaigre de cidre","75 ml d'huile d'olive","1 feuille de laurier","1/2 c. à café de baies roses","1 branche de thym (ou une pincée de thym séché)","1/2 c. à soupe de gros sel","Huile d'olive pour couvrir"], steps:["Préparer le thon : rincer les darnes à l'eau claire (optionnel : les faire dégorger 30 min avec un peu de gros sel, puis bien rincer à nouveau).","Bouillon de cuisson : porter à ébullition l'eau, le vinaigre de cidre, l'huile d'olive, le laurier, les baies roses, le thym et le sel.","Pocher le thon : ajouter les darnes au bouillon frémissant et cuire 15 minutes à feu doux, sans faire bouillir fort. Laisser reposer 5 minutes dans le bouillon hors du feu, puis égoutter.","Désarêter et effeuiller : retirer les arêtes et la peau pour ne garder que la chair tendre.","Mise en bocaux : remplir les bocaux stérilisés avec la chair de thon, ajouter quelques baies roses et un petit morceau de laurier ou de thym dans chaque bocal, compléter avec de l'huile d'olive jusqu'à couvrir entièrement le thon, et fermer hermétiquement.","Conservation : 7 à 10 jours au réfrigérateur, ou stériliser 1 h 30 pour une conservation de plusieurs mois."], tip:"Coquille corrigée : la légende annonce « 5 ml » d'huile dans la liste puis 75 ml dans le déroulé — 75 ml retenus."},
{id:"tarte-concombre-thon", cat:"sale", name:"Tarte concombre-thon", time:"45 min", parts:"6", origin:"@lou.faitdesvideos", desc:"La recette la plus virale de l'été : fraîche, croquante, gourmande… visuellement canon, gustativement addictive, et prête en un éclair.", ingredients:["1 pâte brisée","1 à 2 concombres","2 avocats","1/2 gros oignon rouge","3 conserves de thon","4-5 c. à soupe de fromage frais","Le zeste d'un citron","1 gousse d'ail","1 bouquet de ciboulette","Huile d'olive, fleur de sel, poivre","Graines de sésame noires et blanches"], steps:["Étaler la pâte brisée sur un moule à tarte, à l'envers. Badigeonner d'huile d'olive et saupoudrer de graines de sésame.","Enfourner environ 30 min à 180°C en surveillant bien : selon les fours ça peut aller bien plus vite — sortir la pâte dès qu'elle est bien dorée partout.","Pendant ce temps, couper les concombres en fines lamelles. Dans un bol, mélanger l'oignon rouge coupé finement, la ciboulette hachée, le zeste de citron, l'ail finement haché, le fromage frais et le thon.","Une fois la pâte cuite, la laisser refroidir 10 min.","Étaler une 1ère couche de préparation au thon, ajouter les avocats tranchés finement, recouvrir avec une 2e couche.","Disposer joliment les concombres en rosace. Terminer avec un filet d'huile d'olive, un peu de zeste de citron, de la ciboulette et des graines de sésame."], tip:"À la dégustation, effet wow garanti."},
{id:"mr-freeze-maison", cat:"sucre", name:"Mr Freeze maison (3 parfums)", time:"5 min + 4 h au congélateur minimum", parts:"6 à 8 glacettes", origin:"@ameliezen_", desc:"Le Mr Freeze version maison, sans sucre raffiné : mangue façon mango lassi, pastèque-citron vert, ou fruits rouges.", ingredients:["Mangue : 1 mangue, 1 yaourt végétal à la vanille, un peu d'eau si besoin (pour ajuster la consistance)","Pastèque : de la pastèque, ½ citron vert, sirop d'agave au goût","Fruits rouges : ½ fraises, ½ myrtilles, un peu d'eau (pour ajuster la consistance), sirop d'agave au goût"], steps:["Mixer les ingrédients du parfum choisi (ajuster l'eau pour la consistance).","Verser dans les moules à glacettes.","Congeler au minimum 4 heures."], tip:"Légende minimaliste (pas de déroulé complet) : version reconstituée a minima."},
{id:"quiche-croute-pdt", cat:"sale", name:"Quiche à la croûte de pommes de terre (jambon, épinards & cheddar)", time:"1 h 30", parts:"6 à 8", origin:"@itskatiebien", desc:"Une quiche sans pâte : la croûte est une coque de pommes de terre pressées, dorée et croustillante — honnêtement meilleure qu'une pâte classique.", ingredients:["6 pommes de terre moyennes dorées","Spray d'huile d'avocat","Sel","6 œufs","1/2 tasse (~120 g) de ricotta","1/2 tasse généreuse de cheddar râpé (+ un peu pour le dessus)","1/2 tasse de jambon en dés","1 grosse poignée d'épinards, finement hachés","Sel + poivre","Ciboulette fraîche (finition)","Fleur de sel (finition)"], steps:["Commencer par faire bouillir les pommes de terre : les couper en deux avant de les plonger dans l'eau bouillante pour qu'elles cuisent un peu plus vite.","Bouillir jusqu'à tendreté à la fourchette, laisser tiédir, puis éplucher (la peau doit glisser toute seule).","Pulvériser un moule à charnière d'huile d'avocat, presser les pommes de terre dans le fond et sur les côtés pour former une croûte (utiliser un verre pour bien tasser et façonner uniformément).","Pulvériser la croûte d'un peu d'huile et saupoudrer de sel sur la base et les côtés.","Précuire la croûte 20-25 min à 220°C (425°F), jusqu'à ce qu'elle soit légèrement dorée et commence à croustiller.","Dans un bol, fouetter les œufs, la ricotta, le cheddar, le jambon en dés, les épinards hachés, le sel et le poivre.","Verser dans la croûte précuite, couvrir de cheddar râpé supplémentaire.","Cuire 40-45 min à 220°C (425°F), jusqu'à ce que la garniture soit complètement prise et ne tremble plus au centre.","Laisser tiédir légèrement avant de démouler, puis finir avec la ciboulette fraîche et la fleur de sel."]},
{id:"soupe-concombre-tartine-thon", cat:"sale", name:"Soupe de concombre, tartine thon & chèvre frais", time:"20 min", parts:"2", origin:"@slideforfood", desc:"Repas frais, léger et sans cuisson — environ 30 g de protéines par personne.", ingredients:["1 gros concombre","1 échalote ou 1/2 oignon jaune","1 grosse poignée de basilic (+ pour les toppings)","1 poignée de menthe","100 g de chèvre frais (+ pour les toppings)","200 g de tofu soyeux (ça fonctionne aussi sans : mettez un peu moins d'eau au début et ajustez)","Le jus d'1/2 citron + un peu de zeste","2 c. à soupe d'huile d'olive","Sel, poivre","3 c. à soupe de vinaigre de cidre","100 ml d'eau froide","1 poignée de jeunes pousses d'épinards (facultatif, juste pour la couleur)","4-5 tomates poire","4 tartines","1 gousse d'ail","160 g de thon ou de bonite en conserve/pot en verre de qualité (poids égoutté, pas de miettes de thon !)"], steps:["Éplucher le concombre et vider l'intérieur à l'aide d'une petite cuillère.","Le mixer avec l'oignon ou l'échalote, les herbes, le chèvre frais, le tofu, l'eau, le sel, le poivre, l'huile d'olive, le citron et les épinards. Goûter et ajuster l'assaisonnement (acidité ? sel ? herbes ?), remixer jusqu'à ce que ce soit miam, et placer au frais 15-20 min si possible (le plus, le mieux).","Couper les tomates en deux et râper la chair avec les gros trous de la râpe. Égoutter dans une passoire à petite maille, mélanger avec huile d'olive et sel.","Faire griller les tartines. Servir la soupe avec des petits morceaux de chèvre frais, du basilic, un filet d'huile d'olive et de la fleur de sel en toppings. Gratter la gousse d'ail sur le pain grillé, ajouter la tomate, les morceaux de thon, un filet d'huile d'olive, de la fleur de sel — et du piment si vous voulez, ça va bien avec !"], tip:"Version végétarienne : remplacer le thon par 2 œufs mollets par personne."},
{id:"pates-cremeuses-vegan", cat:"sale", name:"Creamy cheesy pasta (vegan)", time:"25 min", parts:"4", origin:"@broccoli_mum", desc:"Des pâtes crémeuses et fromagères sans huile, sans produits laitiers ni crème : bourrées de légumes, de protéines végétales et de fibres — le genre de repas XXL satisfaisant qui rend la perte de poids facile.", ingredients:["2 barquettes de champignons","2 oignons","2 courgettes","Tofu","Pois chiches","Levure nutritionnelle","Assaisonnement bouillon de légumes","Pâtes au choix","Épinards","Persil","Tomates cerises"], steps:["Émincer les champignons et les oignons, les cuire dans une poêle antiadhésive jusqu'à ce qu'ils soient tendres et caramélisés.","Ajouter les courgettes, le tofu, les pois chiches, la levure nutritionnelle et l'assaisonnement bouillon dans un blender et mixer jusqu'à obtenir une sauce lisse et crémeuse.","Une fois les champignons et oignons bien caramélisés, verser la sauce et cuire quelques minutes jusqu'à ce qu'elle épaississe et soit bien chaude.","Incorporer les pâtes cuites et bien mélanger pour tout enrober de sauce.","Hors du feu, ajouter les épinards frais et bien mélanger.","Terminer avec du persil frais et des tomates cerises pour la couleur."]},
{id:"poisson-tahitien-cru", cat:"sansgluten", name:"Poisson cru à la tahitienne", time:"15 min + 1 h au frais", parts:"1", origin:"@charlinedieteticienne", desc:"Nouvelle idée de repas frais, léger et sans cuisson — une recette de mon amie tahitienne Katia, un banger de l'été !", ingredients:["100 g de filet de poisson congelé","1/4 de concombre pelé et épépiné","50 g de tomates cerises coupées en deux","1/2 petit oignon rouge","1/4 de bouquet d'herbes fraîches : coriandre ou menthe","Le jus de 1/2 à 1 citron entier selon la taille","50 g de lait de coco"], steps:["Couper le poisson encore congelé en dés avec un bon couteau.","Couper le concombre en tranches, ciseler l'oignon, couper les tomates cerises en deux, hacher les herbes.","Mélanger tous les ingrédients et laisser au moins une heure au frigo."], tip:"Pour un repas très léger, déguster tel quel ; pour un repas complet, servir sur un peu de riz basmati chaud ou froid."},
{id:"wraps-avoine", cat:"sale", name:"Wraps avoine-œufs (2 ingrédients)", time:"10 min", parts:"1", origin:"@themimsycalmama", desc:"Un hack appris de @bear_wife_ dont je suis obsédée : faible en glucides, riche en protéines, parfait pour un déjeuner rapide et sain. Il ne faut que de l'avoine et des œufs — garnis de ce que tu veux !", ingredients:["3 c. à soupe bombées de flocons d'avoine","1 c. à soupe d'eau","2 œufs"], steps:["Répartir les flocons d'avoine uniformément sur une poêle chaude.","Ajouter l'eau uniformément autour des flocons et laisser toaster 2-3 minutes.","Ajouter les œufs et étaler uniformément.","Baisser le feu et laisser prendre 3-5 min, jusqu'à croustillant ! Garnir au choix."]},
{id:"mars-glaces-vegan", cat:"sucre", name:"Mars glacés maison vegan", time:"2 h 30 + congélation", parts:"8 barres", origin:"@healthyalie", desc:"La version maison et vegan du Mars : couche glace vanille, caramel d'amandes, couverture chocolat.", ingredients:["Glace vanille : 150 g d'amandes blanches émondées, 200 ml de lait de coco en conserve, 1 c. à soupe d'extrait de vanille pur, 50 g de sirop d'érable ou d'agave, 1 pincée de sel","Caramel d'amandes : 100 g de purée d'amandes blanches, 80 ml de sirop d'érable, 50 ml d'huile de coco fondue, 2 c. à soupe d'extrait de vanille, ½ c. à café de gros sel","Couverture : 150 g de chocolat noir ou au lait vegan, 1 c. à café d'huile de coco (facultatif)"], steps:["Faire tremper les amandes dans un grand volume d'eau bouillante pendant 30 minutes ou plus selon votre blender. Essorer et mixer avec le reste des ingrédients pour la glace vanille. Verser dans un moule à cake et réserver au congélateur 2 heures ou jusqu'à durcissement (au mieux toute la nuit).","Dans un petit bol, fouetter ensemble tous les ingrédients du caramel et verser sur la couche vanille. Remettre au congélateur 30 minutes ou jusqu'à durcissement.","Faire fondre le chocolat avec l'huile de coco, bien mélanger et laisser refroidir complètement. Couper les barres en tailles égales et enrober de chocolat. Déposer sur du papier sulfurisé et laisser durcir au frigo ou au congélateur."], tip:"Elles se conservent au congélateur dans un sac de congélation, comme des glaces classiques."},
{id:"glace-fraise", cat:"sucre", name:"Glace fraise (sans sorbetière)", time:"5 min + congélation", parts:"4", origin:"@peugeot_tristan", desc:"Une glace prête en 5 min, sans sorbetière : ultra onctueuse, rafraîchissante et sans sucre ajouté.", ingredients:["500 g de fraises","1 yaourt de 125 g (nature ou vanille selon tes envies)"], steps:["Placer les fraises et le yaourt au congélateur.","Une fois bien congelés, mixer le tout : tu obtiens une glace ultra onctueuse, rafraîchissante et sans sucre ajouté."], tip:"Cette recette fonctionne avec tous les fruits — parfait pour éviter de jeter des fruits trop mûrs, une bonne astuce antigaspi."},
{id:"salsa-verde-tilleul", cat:"sansgluten", name:"Salsa verde au tilleul", time:"40 min", parts:"4", origin:"@lejardinestlarecette", desc:"Les feuilles de tilleul sont comestibles, délicieuses, disponibles à profusion et gratuites — voilà ma salsa verde, idéale pour l'apéro.", ingredients:["25 jeunes feuilles de tilleul bien fraîches (elles peuvent être grandes mais elles doivent encore être vert clair)","1/2 petit concombre","1 petit oignon rouge","1 belle gousse d'ail","Le jus d'1 citron","3 c. à soupe d'huile d'olive","1/2 c. à café de miel","Sel"], steps:["Ôter la nervure principale des feuilles et les hacher très finement avec un couteau.","Les déposer dans un bol, ajouter le jus de citron, 2 pincées de sel, l'huile, le miel et les travailler avec une fourchette pour détendre les fibres.","Laisser reposer 30 min.","Écraser l'ail, ciseler l'oignon et détailler le concombre en petits dés.","Mélanger tous les ingrédients, rectifier l'assaisonnement et servir avec un fromage frais et des croûtons."], tip:"Les feuilles de tilleul s'utilisent aussi fraîches en salade, cuites comme un légume feuille, en paillettes ou en poudre."},
{id:"tarte-oignon-emmental", cat:"sale", name:"Tarte oignon-emmental", time:"8 h de repos + 1 h de cuisson", parts:"6 à 8", origin:"@franceinter", desc:"La tarte oignon-emmental de l'artisan charcutier @yohanlastre, par François-Régis Gaudry — vous allez devenir totalement accro !", ingredients:["Pâte à pâté : 50 g d'eau (5 cl), 1 c. à soupe de vinaigre blanc, 160 g de beurre doux pommade, 7 g de sel, ½ c. à café de sucre, 1 jaune d'œuf, 175 g de farine, 90 g de fécule","Oignons : 4 oignons doux des Cévennes soit 600 g, 300 g d'emmental français, 70 g d'huile d'arachide, thym frais, poivre moulu, sel"], steps:["Pâte à pâté (à réaliser la veille) : dans un saladier, mélanger l'œuf, l'eau et le vinaigre blanc avec le sucre et le sel pour les dissoudre.","Dans la cuve du robot pâtissier, mélanger pendant une minute, à l'aide de la feuille, le beurre pommade et le mélange liquide : on obtient un mélange tranché. Ajouter la farine et la fécule puis mélanger pendant deux minutes, sans trop travailler la pâte.","Amalgamer l'ensemble avec les mains jusqu'à obtenir une consistance homogène. Couvrir le pâton et laisser reposer 8 h minimum au frigo.","Éplucher et émincer finement les oignons. Les débarrasser dans un saladier avec tous les autres ingrédients et mélanger comme si c'était une salade.","Disposer la totalité des oignons assaisonés sur la pâte en gardant 2 cm de bordure — c'est une tarte fine, elle doit être cuite à plat.","Cuire 1 h à 160°C à chaleur tournante, jusqu'à ce que l'oignon soit caramélisé, presque brun."], tip:"Coquille de la légende : le sel y apparaît deux fois (7 g et ½ c. à c.) — garder 7 g pour la pâte."},
{id:"tomme-kefir", cat:"sansgluten", name:"Tomme au kéfir (la plus facile du monde)", time:"48 h de fermentation + 1 semaine d'affinage", parts:"4 tommes", origin:"@tribuencuisine", desc:"Pas de présure, pas de technique compliquée… juste un peu de temps et de patience — et tu obtiens une vraie tomme maison, simple, naturelle et pleine de goût.", ingredients:["2 L de lait cru de vache","60 ml de kéfir","4 cuillères à café de sel"], steps:["Mélanger le lait et le kéfir dans un saladier, couvrir et laisser fermenter environ 48 heures à température ambiante, jusqu'à obtenir un caillé à cassure nette.","Mouler dans 4 moules, puis laisser égoutter 24 heures.","Retourner délicatement les fromages dans les moules, puis saler le dessus en massant pour bien faire pénétrer.","Laisser égoutter encore 12 heures, puis démouler sur une grille. Saler la deuxième face, toujours en massant légèrement.","Laisser égoutter 12 heures supplémentaires, puis retourner les fromages, sans leur pot.","Ensuite, les retourner chaque jour pendant 1 semaine.","À ce stade, vous pouvez déjà les déguster… ou prolonger l'affinage quelques jours selon vos goûts."]},
{id:"crufiture-fraises-myrtilles", cat:"sucre", name:"Crufiture fraises-myrtilles chia", time:"10 min + 30 min de repos", parts:"2 à 3", origin:"@melanie_en_veganie", desc:"Sans cuisson, sans sucre ajouté, riche en fibres, oméga-3 et antioxydants. Dans un yaourt végétal façon skyr, c'est devenu mon nouvel encas préféré !", ingredients:["150 g environ de fraises fraîches","75 g environ de myrtilles fraîches","2 ou 3 c. à soupe de graines de chia","Un peu de jus de citron (facultatif : améliore la conservation et ajoute de la vitamine C)"], steps:["Rincer les fruits, équeuter les fraises.","Mix rapidement fraises, myrtilles et graines de chia ensemble (garder quelques morceaux si tu veux une texture plus rustique).","Bien mélanger, puis laisser reposer au frais au moins 30 minutes (idéalement 1 h ou toute une nuit) : les graines de chia vont gélifier la préparation !","Conserver 3 à 5 jours au réfrigérateur dans un bocal hermétique."]},
{id:"salade-poulet-proteinee", cat:"sale", name:"Salade protéinée poulet (chicken salad)", time:"15 min", parts:"2", origin:"@louloukitchen_", desc:"Salade protéinée inspirée de la chicken salad de @chefkla.", ingredients:["Du poulet grillé qu'on mixe","Échalote","Fenouil","Chou blanc","Concombre","Cébettes","Salade romaine","Sauce : skyr ou œufs durs, houmous, huile d'olive, citron, sel, poivre"], steps:["Mixer le poulet grillé.","Mélanger avec les légumes et la sauce, et servir bien frais."], tip:"Légende sans déroulé : ingrédients seuls, étapes minimales."},
{id:"scarpaccia-oignon-burrata", cat:"sale", name:"Grande scarpaccia oignon & burrata", time:"30 min de cuisson", parts:"4", origin:"@louloukitchen_", desc:"Une grande scarpaccia aux oignons, servie avec une salade de tomates et de la burrata.", ingredients:["3 oignons","Huile d'olive","Sel","150 g de farine","Environ 100 g d'eau","Du parmesan","Tomates cerises","Tomates séchées","Burrata","Basilic"], steps:["Mélanger farine, eau, parmesan, sel, huile d'olive et les oignons pour la pâte à scarpaccia.","Cuire 30 min à 180°C, attendre que ça tiédisse.","Garnir de tomates cerises, tomates séchées, burrata, huile d'olive et basilic."], tip:"Légende sans déroulé : étapes reconstituées a minima."},
{id:"noodles-10-min", cat:"sansgluten", name:"Nouilles sautées 10 min", time:"10 min", parts:"2", origin:"@saisaifood", desc:"Des nouilles enrobées d'une sauce cacahuète citronnée, prêtes en 10 minutes.", ingredients:["2 c. à soupe de beurre de cacahuète","1 c. à soupe de coriandre (ciboulette ou persil si vous n'aimez pas la coriandre)","1 c. à soupe de cacahuètes concassées non salées","1 c. à soupe de chili flakes","1 c. à café d'ail râpé","1 c. à café de gingembre râpé","1 c. à soupe de sésame grillé","1 c. à soupe d'oignon frais (ciboule)","3 c. à soupe de sauce soja salée","1 c. à café de sucre","5 c. à soupe d'huile bien chaude (ou de l'eau bouillante si t'es au régime)","450 g de nouilles udon (fraîches de préférence)"], steps:["Dans une poêle à froid (ou un grand plat), ajouter le beurre de cacahuète, les herbes, les cacahuètes, le chili flakes, l'ail, le gingembre, le sésame grillé, l'oignon frais, la sauce soja et le sucre.","Verser directement l'huile très chaude par-dessus.","Mélanger immédiatement au fouet jusqu'à obtenir une sauce bien lisse.","Ajouter les nouilles cuites, mélanger pour bien les enrober… et c'est prêt."], tip:"Les udon sont au blé : pour du vraiment sans gluten, utiliser des nouilles de riz."},
{id:"sandwich-libanais-lentilles", cat:"sale", name:"Sandwich libanais aux keftas de lentilles", time:"40 min", parts:"4", origin:"@justine_piluso", desc:"Un sandwich de type libanais garni d'une sorte de keftas de lentilles — mais qui n'est pas un falafel.", ingredients:["200 g de lentilles crues","1 oignon","2 clous de girofle","1 feuille de laurier","2 pommes de terre","1 carotte","1 c. à soupe de chaque épice en poudre : cumin, coriandre, paprika, poivre noir","100 g de farine T55","50 g de farine de pois chiches","Sauce : 5 brins d'estragon, 8 brins de persil, 250 g de crème épaisse ou yaourt, 1 gousse d'ail, 1 citron jaune, sel/poivre","Huile neutre pour la cuisson, pain libanais et émincé de chou rouge","Cébettes émincées (parce que j'adore l'oignon cru)"], steps:["Cuire 30 minutes à couvert les lentilles avec l'oignon, les clous de girofle, le laurier, les pommes de terre et la carotte.","Écraser puis ajouter 1 c. à soupe de chaque épice en poudre (cumin, coriandre, paprika, poivre noir), puis les farines T55 et de pois chiches.","Former des keftas et les cuire à l'huile neutre.","Mélanger la sauce (estragon, persil, crème ou yaourt, ail, citron, sel, poivre).","Monter le sandwich : pain libanais, chou rouge émincé, keftas, sauce et cébettes."]},
{id:"poisson-facon-nobu", cat:"sansgluten", name:"Poisson façon Nobu", time:"15 min + 12 à 24 h de marinade", parts:"4", origin:"@franceinter", desc:"La recette de poisson culte par excellence, le nobu — découverte par François-Régis Gaudry dans le restaurant de son inventeur, Nobu Matsuhisa.", ingredients:["4 pavés de poisson blanc d'environ 115-130 g (dos de lieu jaune, mais la recette fonctionne avec du cabillaud, du bar, du flétan ou du black cod, aussi appelé morue charbonnière)","3 grosses c. à soupe bien bombées de miso blanc","3 c. à soupe de mirin","3 c. à soupe de saké de cuisine (rayon asiatique)","1 c. à soupe de sucre"], steps:["Dans une casserole, mélanger le miso blanc, le mirin, le saké et le sucre. Faire chauffer doucement, sans faire bouillir, juste pour dissoudre le sucre et lisser la marinade. Laisser tiédir.","Dans un plat, enrober le poisson de marinade, filmer et laisser reposer au frais 12 à 24 heures.","Le lendemain, déposer le poisson dans un plat puis l'enfourner dans un four préchauffé à 210°C pendant 10 minutes, puis passer 5 minutes sous le grill pour caraméliser. Surveiller la cuisson : le poisson doit être nacré à cœur et caramélisé sur le dessus."]},
{id:"patates-balls", cat:"sale", name:"Patates balls", time:"30 min", parts:"4", origin:"@franceinter", desc:"La recette des patates balls de François-Régis Gaudry : des promesses de croustillance, de moelleux et d'addiction totale, et super simple à faire.", ingredients:["1 grosse pomme de terre type bintje (environ 300 g) ou 2 pommes de terre moyennes","10 cl d'eau","50 g de fécule de pomme de terre","1/2 c. à café de curry","1/2 c. à café de paprika","2 pincées de sel"], steps:["Peler la pomme de terre. Dans le bol d'un blender, mettre la pomme de terre, l'eau, le curry, le paprika et le sel. Mixer à puissance maximale jusqu'à obtention d'un coulis homogène (environ une minute).","Verser le coulis dans une casserole et faire chauffer 5 minutes à feu fort jusqu'à épaississement, en remuant constamment pour éviter que ça accroche. Obtenir une texture lisse et homogène proche d'une crème pâtissière.","Éteindre le feu et ajouter la fécule de pommes de terre. Mélanger jusqu'à obtenir une texture semblable à une panade.","Dans une casserole large ou une friteuse, déposer de petites boules de pâte à l'aide d'une cuillère à café dans un bain de friture bouillant (huile neutre ou de tournesol). Frire en prenant garde qu'elles n'accrochent pas entre elles : elles sont cuites quand elles remontent à la surface et qu'elles sont bien dorées.","Retirer délicatement à l'aune d'une araignée et déposer sur du papier absorbant pour enlever l'excédent d'huile."], tip:"Coquille corrigée : la légende annonce 10 cl d'eau dans les ingrédients puis « 50 cl » dans le déroulé — 10 cl retenus."},
{id:"beignets-de-fleurs", cat:"sale", name:"Beignets de fleurs", time:"15 min", parts:"4", origin:"@la_table_de_gaya", desc:"Mangeons des fleurs ! Choisissez du fromage local, ramassez les fleurs loin des routes, et régalez-vous avec ce que la Nature vous offre.", ingredients:["135 g de farine","1 œuf","1 verre de lait","1 cuillère à soupe d'huile","Du sel","Toutes les épices que vous voulez","Des fleurs comestibles","Du fromage local"], steps:["Préparer la pâte à beignet : mélanger la farine, l'œuf, le lait, l'huile, le sel et les épices.","Tremper les fleurs dans la pâte et les faire frire, avec le fromage local."], tip:"Coquilles corrigées : « 1 peuf » = 1 œuf, « verre de mait » = verre de lait. Légende sans déroulé : étapes minimales."},
{id:"pate-beurre", cat:"sucre", name:"Pâte magique", time:"10 min + 1 h de repos", parts:"2 pizzas / 6 à 8 buns", origin:"@marjosamira_cook", desc:"La pâte « magique » : facilement réalisable à la main, sans robot, sans pétrissage et sans verre doseur — pour mini pizzas, buns ou mini burgers.", ingredients:["1 verre de farine","1 sachet de levure boulangère déshydratée","1 c. à café de sel","1 verre d'eau tiède","3 c. à soupe d'huile","2 verres de farine (à incorporer petit à petit)"], steps:["Mélanger 1 verre de farine, la levure, le sel et 1 verre d'eau tiède. Laisser reposer 10 min.","Ajouter 3 cuillères à soupe d'huile et 2 verres de farine PETIT À PETIT jusqu'à ce que la pâte forme une boule (ne pas incorporer toute la farine forcément).","Filmer la pâte et laisser reposer minimum 1 h, le temps de préparer vos farces.","Cuisson : mini burgers / buns / mini pizzas, 15-20 min dans un four préchauffé à 180°C. À la poêle : retourner toutes les 10-15 secondes jusqu'à ce que les pains soient dorés (feu moyen fort)."]},
{id:"assassina", cat:"sale", name:"Spaghettis all'assassina", time:"20 min", parts:"3 à 4", origin:"@franceinter", desc:"L'une des recettes de pastas préférées de François-Régis Gaudry, découverte dans les Pouilles et tirée de son amie Alessandra Pierini. Attention, c'est une vraie tuerie !", ingredients:["320 g de spaghetti","400 g de purée de tomate (passata)","2 à 3 c. à soupe de concentré de tomates bio","Harissa ou piment en paillettes","1 c. à café de sucre","10 cl d'huile d'olive","3 gousses d'ail","Sel"], steps:["Dans une casserole, verser 1 litre d'eau, 300 g de passata et le concentré. Faire frémir jusqu'à obtenir un bouillon de tomate léger.","Chauffer la poêle à feu vif. Verser l'huile d'olive, ajouter les 3 gousses d'ail écrasées et la harissa. Laisser blondir l'ail, puis ajouter 100 g de passata.","À feu moyen, recouvrir le fond de la poêle de spaghetti. Laisser frire sans remuer : certaines pâtes doivent caraméliser et former une croûte, sans brûler.","Dès qu'elles commencent à accrocher par endroits, retourner délicatement en ramenant au-dessus les spaghetti déjà brunis.","Ajouter deux louches de bouillon de tomate, laisser s'évaporer, puis recommencer. Poursuivre ainsi 8 à 9 minutes, en alternant caramélisation et ajout de sauce, jusqu'à ce que les spaghetti soient rouge-bruns, tendres, croustillants par endroits, et qu'ils aient absorbé la sauce.","Servir immédiatement."], tip:"Recette de @frgaudry d'après Alessandra Pierini."},
{id:"cookie-dough-pois-chiche", cat:"sucre", name:"Cookie dough pois chiche (dessert pour bien dormir)", time:"5 min", parts:"4", origin:"@cyclee.fr", desc:"Un dessert pour bien dormir ? Yes pleaseeee.", ingredients:["1 boîte de pois chiches rincés (250 g)","60 g de beurre de cacahuètes ou d'amande","25 g de poudre d'amande","2 à 3 c. à soupe de sirop d'érable ou de miel (à ajuster selon vos préférences)","Un peu de vanille (poudre ou extrait)","1 pincée de sel","Autant de pépites de chocolat noir que vous désirez"], steps:["Tout mettre dans un blender et mixer jusqu'à obtenir une pâte à cookie dough."], tip:"Facile et rapide ! Se conserve quelques jours au frigo pour s'assurer plusieurs bonnes nuits de sommeil."},
{id:"spritz-viennois", cat:"sucre", name:"Spritz viennois", time:"45 min", parts:"Une vingtaine de biscuits", origin:"@franceinter", desc:"Les délicieux Spritz, ces gâteaux sablés et chocolatés que François-Régis Gaudry tient de Jonathan Herbster (@eveil.boulangerie, 17e arrondissement de Paris).", ingredients:["190 g de beurre","60 g de sucre cassonade","1/2 gousse de vanille ou 1/2 c. à café de poudre de vanille","1 g de sel","1 blanc d'œuf (30 g)","220 g de farine de blé","200 g de chocolat noir pâtissier 70 %"], steps:["Dans le bol d'un robot pâtissier muni de la feuille, mettre le beurre pommade coupé en gros morceaux et le sucre cassonade. Mélanger à vitesse moyenne jusqu'à ce que le mélange devienne homogène.","Ajouter le blanc d'œuf. Mélanger jusqu'à obtenir une texture bien tranchée. Arrêter le robot et détacher la pâte des parois à l'aide d'une maryse.","Ajouter la farine et la vanille. Mélanger à nouveau 5 minutes à faible vitesse, puis continuer à battre à la feuille, à vitesse rapide, 4 à 5 minutes, jusqu'à ce que la pâte ferme blanchisse et s'assouplisse (le mélange devient crémeux et homogène).","Remplir une poche à douille munie d'une douille moyenne cannelée. Sur une plaque recouverte de papier sulfurisé, réaliser des « M », forme emblématique des spritz.","Enfourner à 170°C pendant 25 minutes.","Pendant la cuisson, faire fondre le chocolat noir. À la sortie du four, laisser légèrement tiédir les biscuits, les tremper à moitié dans le chocolat en les secouant pour faire tomber l'excédent, puis laisser figer sur une plaque avant de déguster."]},
{id:"beurre-maison", cat:"sansgluten", name:"Beurre maison", time:"20 min", parts:"~330 g de beurre", origin:"@cleanyourhomee", desc:"Fabrication du beurre maison — le goût est vraiment délicieux !", ingredients:["1 litre de crème liquide 33 % MG (idéalement 35 % MG), soit environ 330 g de beurre","Sel"], steps:["Verser la crème dans une baratte.","Remuer pendant au moins 15 minutes, jusqu'à ce que le beurre se forme et que le lait se sépare.","Filtrer pour récupérer le beurre et enlever l'excès de lait.","Conserver le lait de beurre (idéal pour pancakes, gâteaux ou boissons).","Plonger le beurre dans un bol d'eau glacée pour le refroidir : ça le rend plus ferme et améliore sa conservation.","Ajouter du sel et façonner le beurre à la main.","Placer dans un beurrier et déguster sur des tartines grillées."]},
{id:"creme-chocolat-haricots-rouges", cat:"sucre", name:"Crème chocolat haricots rouges", time:"10 min", parts:"2 à 3", origin:"@flowlizee", desc:"Une crème au chocolat riche en fer, à base d'haricots rouges.", ingredients:["100 g de chocolat noir","200 g d'haricots rouges","100 g de lait végétal tiède"], steps:["Faire fondre le chocolat.","Mixer les haricots rouges égouttés et rincés avec le chocolat fondu et le lait végétal tiède, jusqu'à obtenir une crème lisse.","Laisser tiédir puis refroidir au frais."], tip:"Légende sans déroulé : ingrédients seuls, étapes minimales."},
{id:"sauce-miel-moutarde", cat:"sale", name:"Sauce miel-moutarde (Ta Diète Ep. 23)", time:"5 min", parts:"~400 ml", origin:"@swiss.fitcook", desc:"Crémeuse, légèrement fumée, avec un petit twist steakhouse grâce au Worcestershire : elle transforme un simple poulet grillé ou des potatoes en vrai plat de taverne.", ingredients:["210 g de skyr ou fromage blanc 0 %","90 g de moutarde à l'ancienne (à ajuster selon la force de la moutarde)","30 g de miel","1 petite gousse d'ail","1 c. à café de sauce Worcestershire ou soja","1/2 c. à café de paprika fumé","1 c. à café de vinaigre de cidre","Sel, poivre au goût"], steps:["Mettre tout dans un blender, mixer.","Goûter, ajuster, et se régaler."], tip:"Valeurs nutritionnelles au 100 g : 80 kcal, 7 g de protéines, 11 g de glucides, 1 g de lipides. Doublon résolu : les posts #54 et #77 diffusaient la même sauce — une seule entrée."},
{id:"egg-muffins", cat:"sale", name:"Egg muffins (sandwichs du matin)", time:"25 min", parts:"5 sandwichs", origin:"@charlie.ma.vie", desc:"Pour reprendre les p'tits dej' salés : bien nourrissant, ça évite de grignoter jusqu'au déjeuner — 30 g de protéines par sandwich.", ingredients:["5 pains à muffins (ou pains bagel, etc.)","10 tranches de cheddar","10 tranches de bacon bien grillées","5 tranches de dinde ou de poulet","4 œufs","220 g de cottage cheese","1 avocat","50 g de chou rouge","8 g de ciboulette","1 c. à soupe de mayonnaise","Moutarde"], steps:["Faire griller au four les petits pains avec une tranche de cheddar sur chaque moitié (7 min à 190°C).","Faire cuire des œufs durs (8 min), les couper en morceaux et les mélanger avec le cottage cheese, le chou rouge, l'avocat, la ciboulette ciselée et la mayonnaise.","Pour l'assemblage : ajouter une tranche de dinde, un peu de moutarde, la farce et terminer par deux tranches de bacon avant de refermer le sandwich."], tip:"À emballer individuellement dans du papier cuisson : 3 jours au frais, ou 2 mois au congélateur. Réchauffer au four ou à l'airfryer 20 min à 190°C, sans retirer le papier cuisson."},
{id:"sables-diamants-matcha", cat:"sucre", name:"Sablés diamants matcha", time:"45 min", parts:"30 à 35 diamants", origin:"@franceinter", desc:"Les sablés diamants hallucinants de François-Régis Gaudry — hallucinants parce qu'ils sont au thé matcha, qui leur apporte une belle note végétale et très gourmande.", ingredients:["200 g de beurre","300 g de farine","50 g de sucre","1 c. à café de matcha bio","1 pincée de fleur de sel","40 g de sucre (pour la cuisson)"], steps:["Dans un saladier, mélanger le beurre pommade avec le sucre. Une fois le mélange homogène, ajouter la farine, le matcha et la fleur de sel. Mélanger jusqu'à obtention d'un pâton qui se décolle des parois du saladier.","Rouler le pâton en 1 ou 2 rouleaux de 3 cm de diamètre, puis réserver au congélateur 20 min.","Préchauffer le four à 200°C chaleur tournante. Verser le sucre restant sur le plan de travail, sortir les rouleaux du congélateur et les rouler dans le sucre : ils doivent en être recouverts. Découper des rondelles d'1 cm d'épaisseur et les déposer sur une plaque recouverte de papier sulfurisé.","Cuire 15 minutes."]},
{id:"tartine-sardine-fenouil", cat:"sale", name:"Tartine sardine-pâté & salade de fenouil", time:"15 min", parts:"2 à 3", origin:"@lucavallsci", desc:"Manger notre soin de la peau… et c'est délicieux : sardines pour les oméga-3, citron pour la vitamine C, huile d'olive pour les bonnes graisses, fenouil et pomme pour le croquant et les antioxydants.", ingredients:["Pâté de sardines : 2 boîtes de sardines à l'huile d'olive, 1 branche de céleri très finement coupée en dés, 1 pomme verte en petits dés, 1-2 c. à soupe d'huile d'olive, jus d'1/2 citron, zeste d'1/2 citron, 1 c. à café de moutarde de Dijon, ciboulette finement hachée, aneth finement haché, sel et poivre noir","Salade de fenouil : 1 bulbe de fenouil très finement émincé, jus d'1/2 citron, 1-2 c. à soupe d'huile d'olive, 1 c. à café de miel, 1 pincée de sel","Du pain au levain épais, grillé"], steps:["Mélanger tous les ingrédients du pâté de sardines.","Mélanger les ingrédients de la salade de fenouil.","Toaster le pain au levain, tartiner de pâté de sardines et servir avec la salade de fenouil par-dessus."], tip:"Il s'avère que la peau rayonnante, c'est un goût de tartine sardine."},
{id:"salade-fenouil-pomme", cat:"sansgluten", name:"Salade fenouil-pomme", time:"10 min", parts:"2", origin:"@flowlizee", desc:"Une salade fraîche, healthy et anti-inflammatoire : fenouil, pomme granny et roquette.", ingredients:["1 fenouil","1 pomme granny smith","2 poignées de roquette","2 c. à soupe d'huile d'olive","1 c. à café de miel","1 c. à café de moutarde","Jus d'1/2 citron","Sel/poivre"], steps:["Émincer finement le fenouil et couper la pomme.","Mélanger avec la roquette et la vinaigrette (huile d'olive, miel, moutarde, citron, sel, poivre)."], tip:"Légende sans déroulé : ingrédients seuls, étapes minimales."},
{id:"pois-chiches-grilles", cat:"sansgluten", name:"Super pois chiches grillés", time:"45 min", parts:"4", origin:"@franceinter", desc:"La recette des super pois chiches grillés pour l'apéro : une alternative végétale, saine et nourrissante à tous les biscuits industriels.", ingredients:["400 g de pois chiches bio cuits et égouttés","2 c. à soupe d'huile neutre","2 c. à café de paprika classique ou fumé","2 c. à soupe de sauce tamari (à défaut, de la sauce soja)","1 c. à café de cumin en poudre","1 citron bio"], steps:["Préchauffer le four à 200°C.","Dans un saladier, mélanger l'ensemble des ingrédients. Déposer les pois chiches et les épices sur une plaque recouverte de papier cuisson et enfourner 45 min en mode grill. À mi-cuisson, remuer les pois chiches pour permettre une cuisson homogène.","À la sortie du four, rectifier l'assaisonnement, zester le citron puis mélanger avant de servir."]},
{id:"tofu-pois-casses", cat:"sansgluten", name:"Tofu de pois cassés", time:"10 min + 1 h au frais", parts:"4", origin:"@mureetnoisettes", desc:"Recette facile et économique, avec 50 g de protéines.", ingredients:["250 g de pois cassés pesés secs (à faire tremper une nuit dans de l'eau : ils vont doubler de poids — jeter l'eau de trempage)","600 g d'eau pour mixer","Sel, jus de citron, ail"], steps:["Mixer les pois cassés trempés avec l'eau, le sel, le jus de citron et l'ail.","Faire chauffer à feu moyen en mélangeant tout du long, jusqu'à obtenir une purée épaisse.","Mettre dans un contenant et laisser refroidir au moins une heure au frais."], tip:"À cuisiner comme du tofu : à la poêle, grillé, déglacé… ou comme une panisse, juste frite, accompagnée d'aïoli maison. Doublon résolu : le post #126 repostait cette recette — une seule entrée."},
{id:"crackers-express", cat:"sale", name:"Crackers sains et express", time:"25 min", parts:"1 plaque", origin:"@belqisvl", desc:"Des crackers maison rapides, à personnaliser avec fromage, thym et graines.", ingredients:["15 g de flocons d'avoine","65 g de farine (blé, petit épeautre ou épeautre)","65 g d'eau","25 g d'huile d'olive","Toppings : 1 c. à café de sel, 2 poignées de fromage râpé au choix, 1 c. à café de thym, 35 g de graines de courge, 15 g de sésame"], steps:["Dans un bol, verser tous les ingrédients de la base et mélanger la pâte à l'aide d'une cuillère en bois (elle est collante et humide, c'est normal).","Ajouter les toppings et mélanger une dernière fois.","Étaler la pâte entre deux feuilles de papier sulfurisé à l'aide d'un rouleau à pâtisserie. Enlever la feuille du dessus puis prédécouper vos crackers de la forme souhaitée.","Cuire environ 20 min à 180°C. Une fois cuits, attendre qu'ils refroidissent complètement avant de casser la plaque."], tip:"Conserver dans une boîte hermétique à température ambiante."},
{id:"riz-au-lait-noisette", cat:"sansgluten", name:"Riz au lait de noisette & vanille (sans lactose)", time:"40 min", parts:"4", origin:"@belqisvl", desc:"Un riz au lait sans lactose au lait de noisette, tiède ou bien frais.", ingredients:["100 g de riz rond (spécial dessert)","1 L de lait de noisette","40 à 60 g de sucre (sucre blond, coco, ou miel, érable…)","1 gousse de vanille","1 pincée de sel","Optionnel : purée de noisette pour plus de gourmandise"], steps:["Rincer le riz à l'eau froide jusqu'à ce que l'eau soit claire. Fendre la gousse de vanille en deux et gratter les graines.","Dans une casserole, verser le lait de noisette, le sucre, la vanille (graines + gousse) et la pincée de sel. Porter à frémissement.","Ajouter le riz, baisser sur feu doux et laisser cuire 30 à 35 min, en remuant très régulièrement pour éviter que ça accroche.","Retirer du feu et laisser tiédir : il épaissira encore en refroidissant."], tip:"Ajouter 1 c. à café de purée de noisette au fond des pots pour un goût encore plus intense. Se conserve jusqu'à 4 jours au frigo."},
{id:"pate-tartiner-sarrasin", cat:"sucre", name:"Pâte à tartiner au sarrasin", time:"30 min", parts:"1 pot", origin:"@sarah__lenormand", desc:"Le sarrasin torréfié apporte un goût presque biscuité, profond, chaud, rond, presque praliné — pas besoin de charger en sucre, le goût fait déjà tout le travail.", ingredients:["210 g d'amandes","140 g de sarrasin","140 g de chocolat au lait","35 g de sucre","35 g de beurre","Un peu d'eau, si nécessaire"], steps:["Torréfier ensemble le sarrasin et les amandes, doucement, jusqu'à ce qu'ils soient bien dorés et bien parfumés.","À côté, réaliser un caramel : le sucre avec un peu d'eau, cuit jusqu'à 170°C. L'étaler aussitôt en fine couche, puis laisser refroidir complètement.","Une fois le caramel dur, le casser en morceaux et mixer le caramel, les amandes et le sarrasin jusqu'à obtenir un praliné bien fin, lisse et brillant.","Faire fondre le chocolat au lait avec le beurre, et incorporer ce mélange au praliné de sarrasin.","Mixer une dernière fois : on obtient une pâte à tartiner ultra gourmande. Mettre en pot."], tip:"Conservation : 2 à 3 semaines dans un pot hermétique, à température ambiante si la pièce est fraîche, ou au réfrigérateur pour une texture plus ferme (la sortir un peu avant dégustation). Parfaite pour les matins d'hiver, les goûters ou les cadeaux de Noël faits maison."},
{id:"cereal-cookies", cat:"sucre", name:"Cereal cookies", time:"20 min", parts:"Une douzaine", origin:"@spicymoustache", desc:"Breakfast revenge : des cookies céréales qui se préparent en deux temps trois mouvements.", ingredients:["1 tasse (125 g) de farine (ou ½ tasse de farine d'avoine + ½ tasse de farine blanche)","1/2 tasse (100 g) de sucre non raffiné (ou n'importe quel sucre)","1/2 c. à café de bicarbonate de soude","1 pincée de sel","1/4 tasse (45 g) de pépites de chocolat","3 c. à soupe de lait (au choix)","50 g de beurre ou d'huile de coco","Quelques gouttes d'extrait de vanille"], steps:["Mélanger tous les ingrédients dans un bol. Ajouter un peu de farine si nécessaire jusqu'à ce que la pâte se tienne.","Rouler la pâte en boudin de 1-2 cm d'épaisseur et le placer au congélateur ou au frigo jusqu'à ce qu'il durcisse : ce sera plus facile à trancher.","Découper le boudin en rondelles et les déposer sur du papier cuisson, en laissant environ 3 cm entre chaque cookie.","Cuire 6 minutes à 180°C, pas plus, sinon ils brûlent.","Laisser les cookies refroidir complètement avant de servir."]},
{id:"frangipane-sans-gluten", cat:"sansgluten", name:"Gâteau sans gluten façon frangipane", time:"45 min", parts:"8", origin:"@belqisvl", desc:"Sans gluten, sans lait, sans beurre… mais terriblement gourmand.", ingredients:["150 g de yaourt","2 œufs","70 g de sirop d'érable ou de miel","60 g de purée d'amande (ou beurre, huile neutre, huile de coco ou beurre fondu)","200 g de poudre d'amandes","8 g de levure chimique","1 c. à café d'arôme d'amande amère (ou vanille à défaut)","1 pincée de sel","1 amande entière (facultatif, façon fève)"], steps:["Préchauffer le four à 180°C.","Dans un saladier, mélanger tous les ingrédients humides : yaourt, œufs, sirop d'érable et purée d'amande.","Ajouter ensuite les ingrédients secs : poudre d'amandes, levure, sel et arôme ou vanille. Mélanger jusqu'à obtenir une pâte homogène.","Verser dans un moule de 20 cm, glisser une (ou deux) amande entière dans la pâte, façon fève.","Enfourner 35 à 40 minutes : le gâteau doit être doré et légèrement moelleux au centre."], tip:"J'adore saupoudrer de sucre glace une fois refroidi."},
{id:"sauce-simba", cat:"sale", name:"Sauce Simba (Ta Diète Ep. 19)", time:"5 min", parts:"~320 ml", origin:"@swiss.fitcook", desc:"Ramène un peu du soleil d'Afrique dans ta diète : fruitée, fumée, légèrement spicy et ultra crémeuse — la sauce qui réveille ton poulet grillé, tes bowls, tes wraps ou tes frites sans exploser tes calories.", ingredients:["120 g de cottage cheese 0-2 %","120 g de yaourt grec 0 %","35 g de concentré de tomate","30 g de fruit de la passion","1 c. à soupe de PB2 (beurre de cacahuète en poudre)","1 c. à café bombée de paprika fumé","1/2 à 1 c. à café de pâte de piment peri-peri ou harissa","1/2 c. à café de gingembre frais râpé","1 petite gousse d'ail","1 c. à café de sauce soja","1 c. à café de vinaigre de cidre","Le jus + zeste d'1/2 citron vert","Sel, poivre au goût","Pour épaissir : 1 feuille de gélatine ramollie dans de l'eau chaude"], steps:["Balancer TOUT dans un mixeur… et c'est prêt."], tip:"Valeurs nutritionnelles au 100 g : ~85 kcal, 11 g de protéines, 8 g de glucides, 1 g de lipides."},
{id:"tartelettes-choco-banane", cat:"sucre", name:"Tartelettes healthy au chocolat", time:"20 min", parts:"4 tartelettes", origin:"@sandrine_healthy", desc:"À tomber raide dingue d'amour après les avoir goûtées.", ingredients:["75 g de banane mûre écrasée","20 g de graines de sésame","10 g de graines de lin","20 g de flocons d'avoine","30 g de chocolat noir 70 %","Noix de coco râpée"], steps:["Mélanger la banane écrasée, les graines de sésame, de lin et les flocons d'avoine, puis déposer la pâte sur un papier cuisson. Former les tartelettes à l'aide d'une cuillère en aplatissant légèrement le centre (pour accueillir le chocolat après cuisson).","Enfourner à l'air fryer 10 min à 180°C.","Faire fondre le chocolat noir et le verser au centre des tartelettes cuites.","Saupoudrer de noix de coco et réserver quelques minutes au frigo."]},
{id:"gateau-marron", cat:"sucre", name:"Gâteau au marron", time:"45 min", parts:"8", origin:"@lafoodloveuse", desc:"Mon incontournable gâteau au marron, celui que ma mère nous prépare depuis toujours : ultra simple, mais aux 3 textures que tout le monde adore.", ingredients:["2 œufs","100 g de sucre","80 g de beurre pommade","300 g de crème de marrons (ça marche aussi avec 350 g)","100 g de farine","2 c. à café de levure chimique"], steps:["Fouetter les œufs avec le sucre jusqu'à obtenir une texture bien mousseuse.","Ajouter le beurre pommade, puis la crème de marrons.","Incorporer la farine et la levure chimique.","Verser dans un moule de 18-20 cm puis enfourner 35 minutes à 150°C."], tip:"Coulant au cœur (si vous gérez bien la cuisson), moelleux sur les bords, croustillant sur le dessus — le combo parfait pour les amoureux de la crème de marron. Laisser légèrement tiédir avant de profiter."},
{id:"udon-cacahuete-gochujang", cat:"sale", name:"Udon cacahuète gochujang et citron", time:"20 min", parts:"8", origin:"@jeromesplantkitchen", desc:"Nourrir la copine, épisode 1 : un plat qui se réchauffe au micro-ondes, qui prend 20 minutes et qu'on peut faire en grosses quantités.", ingredients:["~1 kg de nouilles udon","300 g de PST (protéines de soja texturées) en granulés","3 c. à soupe d'huile de sésame","Sauce : 2 c. à soupe bien bombées de beurre de cacahuète, 1 c. à soupe de gochujang, 5 gousses d'ail épluchées, 5 cl de sauce soja, du sel, le même volume que les autres ingrédients de la sauce mais en eau","Légumes : 2 poivrons rouges, 1 cébette (seulement le vert), 1 demi-oignon jaune, 3 citrons verts"], steps:["Cuire les udons dans de l'eau bouillante.","Couper les légumes en tranches fines et le citron en quartiers.","Mixer tous les ingrédients de la sauce ensemble, si possible avec une partie de l'eau des udons.","Faire chauffer puis ajouter les PST directement dedans.","Ajouter progressivement de l'eau pendant qu'elles se réhydratent et remélanger à chaque fois : il faut que la sauce reste… une sauce.","Goûter puis ajuster éventuellement le sel, et ajouter l'huile de sésame à cette étape.","Servir la sauce sur des nouilles, puis des légumes, mélanger tout puis servir les portions avec un quart de citron (ou mettre tout ça dans des boîtes repas !)."], tip:"PST : granulés de Vantastic Food (officialveganshop) ou en épicerie bio — éviter Markal et Grillons d'Or, elles laissent un goût vraiment bof."},
{id:"one-pot-orzo-pois-chiches", cat:"sale", name:"One-pot orzo & pois chiches", time:"50 min", parts:"4", origin:"@miraysway", desc:"Le genre de plat que tu prépares en 5 minutes… et le four fait tout : un one-pot végétarien, ultra parfumé, réconfortant et sans prise de tête.", ingredients:["1 verre d'orzo","1 boîte moyenne de pois chiches (égouttés)","400 g de pulpe de tomate","200 ml de lait de coco","2 verres d'eau","1 cube de bouillon émietté","1 c. à café de curry","1 c. à café d'ail en poudre","1 c. à café de paprika","Sel & poivre (à ajuster)"], steps:["Mettre tous les ingrédients dans un plat.","Mélanger rapidement.","Enfourner 45 min à 200°C.","Mélanger en fin de cuisson… et servir bien chaud."]},
{id:"pate-light", cat:"sansgluten", name:"Pâte à tarte légère (4 ingrédients)", time:"10 min + cuisson", parts:"1 tarte", origin:"@lou.faitdesvideos", desc:"La pâte à tarte pépite : tu as sans doute déjà tous les ingrédients à la maison pour la tester dès ce soir !", ingredients:["250 g de farine de ton choix","80 ml d'eau","70 ml d'huile de ton choix (olive pour moi)","2 belles pincées de sel","Facultatif : quelques graines de sésame ou herbes de Provence pour encore plus de goût"], steps:["Mélanger la farine, l'eau, l'huile et le sel — c'est tout !","L'étaler aussitôt et enfourner à 180°C jusqu'à ce que la tarte soit bien dorée. C'est prêt !"]},
{id:"gaufre-pdt", cat:"sale", name:"Gaufre de pomme de terre", time:"30 min", parts:"1 à 2", origin:"@quickandyummybyeuge", desc:"Si tu n'as jamais mis une pomme de terre entière dans ton gaufrier… il est temps de découvrir cette pépite : croustillante à l'extérieur, fondante à l'intérieur.", ingredients:["Des pommes de terre cuites (avec la peau)","Du fromage râpé (emmental, cheddar, parmesan…)","Sel, poivre","Toppings au choix : avocat, œuf, sauce pimentée"], steps:["Faire cuire les pommes de terre à l'eau jusqu'à ce qu'elles soient tendres.","Déposer la pomme de terre dans le gaufrier chaud et huilé.","Ajouter une bonne poignée de fromage râpé par-dessus.","Refermer le gaufrier et laisser cuire jusqu'à obtenir une croûte bien dorée et croustillante.","Ajouter de l'avocat en lamelles et un œuf au plat.","Arroser d'un peu de sauce (optionnel) et déguster immédiatement."], tip:"Crédit : @thechefoutwest."},
{id:"nouilles-poulet", cat:"sale", name:"Nouilles sautées au poulet", time:"25 min", parts:"3 (mais 2 en vrai)", origin:"@lagrande_bouffe", desc:"Les nouilles qui passent de « un lundi triste » à « bah je veux manger ça jusqu'à la fin de ma vie en fait ».", ingredients:["Des nouilles","2 hauts de cuisses de poulet","Des tiges de cébettes","1 carotte","2 gousses d'ail","1 bout de gingembre","Huile neutre (+ huile de sésame, optionnel mais ça fait grave la diff)","3 c. à soupe de sauce soja","1 c. à café de sauce soja foncée (c'est ça qui donne la couleur)","1 c. à café de sauce huitre","1 c. à café de miel","1 c. à café de gochujang","Graines de sésame"], steps:["Faire cuire des nouilles.","Découper le poulet (sans peau ni os) en toutes petites bouchées.","Émincer grossièrement la partie blanche des cébettes comme un oignon, garder le vert en grands tronçons. Découper la carotte en bâtonnets très fins. Préparer l'ail et le gingembre.","Faire dorer d'abord le poulet seul dans un filet d'huile neutre et le réserver.","Balancer ensuite les cébettes et les carottes, laisser cuire un petit 5 minutes, puis râper l'ail et le gingembre.","Laisser encore 2 minutes et ajouter les nouilles par-dessus.","Ajouter les sauces soja, soja foncée, huitre, le miel et le gochujang. Remettre le poulet et bien tout remuer.","Dégager dans une assiette avec ton poids en graines de sésame par-dessus."]},
{id:"cheesecake-basque-creme-marrons", cat:"sucre", name:"Cheesecake basque à la crème de marrons", time:"50 min + 4 h au frais", parts:"8 à 10", origin:"@franceinter", desc:"François-Régis Gaudry nous invite à découvrir ce cheesecake basque à la crème de marrons.", ingredients:["400 g de cream cheese (type fromage à tartiner, aussi trouvable en fromagerie en version artisanale)","400 g de mascarpone","300 g de crème de marron","150 g de sucre semoule","5 œufs","30 cl de crème fleurette","25 g de fécule de maïs"], steps:["Verser le cream cheese, le sucre, le mascarpone et la crème de marron dans la cuve d'un batteur et mélanger à vitesse moyenne. Quand le mélange est bien homogène, ajouter les œufs un par un, toujours à vitesse moyenne.","Incorporer la fécule et mélanger à nouveau. Ajouter ensuite la crème en filet et augmenter la vitesse pour homogénéiser l'appareil (il est normal qu'il soit liquide).","Beurrer un moule rond de 24 cm et le chemiser de papier sulfurisé : le papier doit dépasser tout autour et adhérer aux parois. Y verser la préparation.","Donner un coup sec du moule sur le plan de travail pour chasser les bulles d'air. Enfourner et cuire 40 minutes à 220°C, chaleur tournante : la préparation doit brunir mais le centre rester très crémeux.","À la sortie du four, laisser reposer. Une fois le gâteau refroidi, réserver 4 heures au frais ou, mieux, une nuit entière. Démouler avant de servir."]},
{id:"raviolis-sans-pliage", cat:"sale", name:"Raviolis sans pliage (à griller)", time:"30 min", parts:"4 (environ 30 raviolis)", origin:"@cooking_with_morgane", desc:"Revoici les raviolis sans pliage ! Et pour encore plus de goût, tu vas les faire griller.", ingredients:["400 g de viande hachée (hauts de cuisse de poulet ou autre)","2 gousses d'ail","1/4 c. à café de sel","1/4 c. à café de poivre moulu","2 c. à soupe de sauce soja claire","1 c. à soupe de saké pour cuisine","1 c. à café de gingembre râpé","1 c. à café de sucre","1 blanc de poireau","3 cébettes","1 œuf","1 c. à soupe de fécule de maïs","30 feuilles de raviolis wonton","2 c. à soupe d'huile de tournesol","2 c. à soupe d'huile de sésame grillé"], steps:["Mélanger la viande hachée avec l'ail, le sel, le poivre, la sauce soja, le saké, le gingembre, le sucre, le poireau, les cébettes, l'œuf et la fécule pour préparer la farce.","Déposer la farce entre les feuilles wonton et faire griller les raviolis (avec les huiles de tournesol et de sésame)."], tip:"Légende sans déroulé complet : étapes minimales, montage libre."},
{id:"gyozas-viande", cat:"sale", name:"Gyozas maison (viande)", time:"1 h", parts:"50 gyozas", origin:"@les_recettes_de_margaux", desc:"Les gyozas sont l'un de mes plats préférés ! Après cette vidéo, vous n'aurez plus aucune excuse pour les acheter tout prêts.", ingredients:["Pâte : 300 g de farine, 200 ml d'eau bouillante, 1 pincée de sel","Farce : 1 oignon, 3-4 gousses d'ail hachées, 1 poignée de champignons séchés, 1 carotte, 250 g de viande hachée, 1 morceau de gingembre, 2 c. à soupe de sauce soja, piment, poivre, sel, 1 c. à soupe d'huile de sésame"], steps:["Pâte : mélanger la farine, l'eau bouillante et le sel, puis pétrir jusqu'à obtenir une pâte souple. Étaler finement et découper des disques.","Farce : mélanger tous les ingrédients de la farce.","Garnir les disques de farce et plier les gyozas.","Cuisson : 5 min dans une poêle légèrement huilée, puis 10 min à couvert avec un fond d'eau dans la poêle."]},
{id:"poisson-coco-blettes", cat:"sansgluten", name:"Poisson coco aux blettes", time:"25 min", parts:"3", origin:"@elisegilmor", desc:"Ma nouvelle addiction pour l'immunité : un plat anti-inflammatoire, poisson blanc, blettes et nouilles de riz au lait de coco.", ingredients:["6 branches de blette","2 pavés de poisson blanc (ici lieu jaune)","1 brique de lait de coco","120 g de nouilles de riz ou de nouilles soba (au sarrasin)","2 c. à soupe de sauce soja salée (le tamari est sans gluten)","Épices : 2 c. à café de gingembre, 2 c. à café de curcuma et 3 c. à café de curry + gingembre frais","Herbes aromatiques (coriandre, mélisse ou persil)","Huile de coco ou ghee (pas de tournesol, car inflammatoire)"], steps:["Laver et couper les branches de blettes en morceaux de 2 cm. Couper le poisson en gros morceaux de 3 cm sur 3 cm pour les garder intacts. Peler et couper le gingembre frais (ou de l'ail).","Dans une casserole ou un wok, faire revenir dans l'huile de coco ou le ghee les épices, puis les blettes. Ajouter 100 ml d'eau et couvrir.","Au bout de 5 min, ajouter le lait de coco, 100 ml d'eau, le poisson et les nouilles. Couvrir encore 5-7 min.","Servir avec les herbes aromatiques et se régaler !"]},
{id:"jaune-oeuf-confit-marinade", cat:"sansgluten", name:"Jaune d'œuf confit (marinade)", time:"3-4 h à 48 h de marinade", parts:"4 jaunes", origin:"@margauxlerhino", desc:"La marinade pour vos jaunes d'œufs confits : de texture miel à solide, en passant par texture confiture et gelée (et plus ils marinent, plus ils seront salés).", ingredients:["Des jaunes d'œufs","100 ml de sauce soja","1 c. à café de miel","2 gousses d'ail pressées","1 cébette ciselée","1 c. à café de piment doux","1 c. à café de graines de sésame"], steps:["Mélanger tous les ingrédients de la marinade.","Ajouter les jaunes d'œufs dans la marinade et mettre au frais !","Laisser mariner de 3-4 h à 48 h selon la consistance voulue."], tip:"Parfait pour un pique-nique façon onigiri ou œuf confit."},
{id:"baked-feta-chicken", cat:"sale", name:"Baked feta chicken & sweet potato (meal prep)", time:"1 h", parts:"4", origin:"@adamhoad_coaching", desc:"Un meal prep high-protein tout au four : poulet, feta, patate douce et brocoli, avec un dressing yaourt-tahini.", ingredients:["500 g de patate douce","500 g de blancs de poulet","150 g de feta","240 g de pois chiches (égouttés)","200 g de brocoli","200 g d'oignon","40 ml d'huile d'olive","Sel, ail granulé, herbes mélangées & poivre","Dressing : 100 g de yaourt grec allégé, 10 g de tahini, 1 c. à soupe de cumin, le jus d'1 citron, 1 pincée de sel, 50 ml d'eau pour fluidifier"], steps:["Ajouter la patate douce, le brocoli, l'oignon et la feta émiettée sur une plaque allant au four. Bien assaisonner.","Rôtir 30 minutes dans un four préchauffé à 200°C. Ajouter ensuite le poulet et cuire encore 20-25 minutes.","Mélanger le yaourt, le tahini, le cumin, le citron, le sel et l'eau pour obtenir une sauce lisse.","Napper la plaque de sauce, servir et savourer."], tip:"Chaque portion (1/4) : 510 kcal, 43 g de protéines, 41 g de glucides, 17 g de lipides. Coquille corrigée : « 4 ml » d'huile d'olive → 40 ml."},
{id:"petillant-peche-romarin", cat:"sucre", name:"Pétillant naturel pêche-romarin", time:"4 h de fermentation + 2 jours au frigo", parts:"1 litre", origin:"@frgaudry", desc:"Surfer sur la vague du pétillant naturel depuis la Corse… et déclencher un tsunami 🌊 — la recette, à manier avec précaution !", ingredients:["2 pêches","2 citrons","1 branche de romarin","70 g de sucre","2 g de levure fraîche de boulanger","1 litre d'eau"], steps:["Couper les pêches et les citrons et les déposer dans un bocal. Ajouter le romarin, le sucre, la levure et l'eau.","Laisser fermenter 4 heures à température ambiante. Dès l'apparition de l'effervescence, filtrer la boisson dans une bouteille à fermeture manuelle (une vieille bouteille de limonade fera très bien l'affaire) et conserver au frigo pendant 2 jours."], tip:"Si vous ne voulez pas repeindre la cuisine, dégazer la boisson 2 fois par jour avant de servir !"},
{id:"fudge-chocolat-pois-chiches", cat:"sucre", name:"Fudge au chocolat (2 ingrédients)", time:"10 min + 1 h au frais", parts:"1 boîte", origin:"@le.renard.et.les.raisins", desc:"Le fudge au chocolat en 2 ingrédients : sans gluten, sans lait, sans œuf, vegan.", ingredients:["400 g de pois chiches (cuits, poids net égoutté)","300 g de chocolat noir sans lait (pour moi, sans sucre ajouté)","Facultatif : 1 pincée de fleur de sel"], steps:["Faire fondre le chocolat au bain-marie.","Rincer et égoutter les pois chiches.","Mixer les pois chiches avec les 3/4 du chocolat fondu jusqu'à l'obtention d'un mélange lisse et homogène.","Verser le mélange dans une boîte hermétique recouverte de papier sulfurisé, lisser le dessus, puis verser le reste du chocolat fondu et parsemer d'un peu de fleur de sel.","Placer au frais pour au moins 1 h. Au moment de déguster, couper des morceaux (passer la lame du couteau sous l'eau chaude pour faciliter cette étape)."]},
