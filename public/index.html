{id:"gateau-yaourt", cat:"sucre", name:"Gâteau au yaourt de Cyril Lignac", time:"40 min", parts:"6 à 8", origin:"@lesideesdelele", desc:"Le gâteau au yaourt, un incontournable : la recette sans prise de tête, sans balance, ludique à faire avec les enfants — avec l'ingrédient en plus de Cyril Lignac qui change tout.", ingredients:["1 pot de yaourt","1 pot (du pot de yaourt) de sucre semoule (pour moi 1/2, voire moins)","3 pots de farine","3 œufs","1 sachet de sucre vanillé","1 sachet de levure chimique","1 pot d'huile d'arachide ou de tournesol","1/2 citron"], steps:["Préchauffer le four à 180°C et récupérer les zestes du demi-citron.","Dans un récipient, mélanger le yaourt et les œufs.","Puis ajouter le sucre, la farine, la levure, le sucre vanillé et les zestes de citron.","Bien mélanger et terminer par l'huile.","Quand la préparation est bien homogène, la verser dans un moule à cake beurré et fariné.","Cuire entre 25 et 30 min en surveillant bien.","Laisser refroidir, démouler et se régaler !"]},
{id:"petits-pains-lentilles", cat:"sansgluten", name:"Petits pains de lentilles corail", time:"10 min + 25 min de cuisson", parts:"4 à 6 pains", origin:"@amandineleger", desc:"Des petits pains de lentilles corail sans gluten, sans levure, découverts sur le compte de @dr.doodoolicious.", ingredients:["200 g de lentilles corail (à faire tremper 1 nuit puis bien rincer)","20 g de téguments de psyllium","60 ml d'eau","1,5 c. à soupe d'huile d'olive","1/2 c. à café de bicarbonate","1/2 c. à café de sel","1/2 c. à soupe de jus de citron"], steps:["Mixer tous les ingrédients jusqu'à obtenir une pâte.","Former les pains et cuire 25 min à 180°C.","Laisser refroidir avant de garnir."], tip:"La recette de la tartinade était en commentaire du post. Des légumineuses qui ne font plus ballonner 💨"},
{id:"gnocchis-creme-parmesan", cat:"sale", name:"Gnocchis & crème de parmesan", time:"1 h 15", parts:"4", origin:"@nabil_zemmouri", desc:"Quelques précisions pour faire vos meilleurs gnocchis : plus la pomme de terre est vieille, moins elle a d'humidité, et plus elle se prête aux gnocchis.", ingredients:["Pour 300 g de pulpe : 60 g de farine et 1 jaune d'œuf","Du gros sel","Crème de parmesan : 200 g de crème liquide et 100 g de parmesan"], steps:["Pas de cuisson à l'eau : on veut retirer l'humidité, pas en rajouter — cuisson au four 1 h à 180°C (le gros sel capte l'humidité, mais on peut aussi s'en passer).","Toujours travailler la pomme de terre à chaud, sinon elle corde (devient élastique).","Mélanger 300 g de pulpe avec 60 g de farine et 1 jaune d'œuf, puis étaler sur un plan fariné. Façonner les gnocchis sur un plan de travail à peine fariné.","Crème de parmesan : faire chauffer 200 g de crème liquide, dès l'ébullition couper immédiatement le feu, ajouter 100 g de parmesan et fouetter aussitôt."]},
{id:"guacamole-brocoli", cat:"sale", name:"Guacamole au brocoli", time:"30 min", parts:"4", origin:"@franceinter", desc:"Aujourd'hui c'est guacamole, oui mais au brocoli ! Pas de couac avec cette recette de guac, goûtée et approuvée à la table de @alicetuyet.", ingredients:["1 tête de brocoli (soit 300 g)","1 c. à soupe de moutarde","4 cl d'huile d'olive","4 cl d'huile de tournesol","Quelques gouttes de Tabasco","1 quart d'oignon rouge","2 tomates confites","Cébettes et citron vert pour le dressage"], steps:["Prélever les sommités de brocoli, puis tailler le pied épluché en petits morceaux assez fins. Cuire le tout à la vapeur jusqu'à ce que la chair soit fondante (une dizaine de minutes).","Pendant la cuisson, mélanger dans un récipient la moutarde et les huiles. Hacher finement les tomates confites et ciseler l'oignon rouge.","Une fois cuits, égoutter les brocolis et les débarrasser dans une eau glacée. Bien égoutter de nouveau (c'est très important pour la texture).","Dans un robot mixeur, mixer une première fois doucement les brocolis refroidis, puis verser progressivement le mélange moutarde-huiles, ajouter le sel, le Tabasco et un trait de citron vert. Ajouter les tomates confites et l'oignon ciselé, mixer une dernière fois.","Goûter, rectifier l'assaisonnement. Au moment de servir, ajouter de la cébette émincée, des zestes et du jus de citron vert selon l'envie."], tip:"À déguster à l'apéro avec des crackers ou des tartines de pain grillé."},
{id:"wrap-quinoa-betterave", cat:"sansgluten", name:"Wrap sans farine quinoa-betterave", time:"25 min", parts:"2 à 3 wraps", origin:"@1000recettesfaciles", desc:"Un wrap sans farine, sans gluten, à base de quinoa et de betterave.", ingredients:["200 g de quinoa","200 ml d'eau","3 pincées de sel","1 betterave cuite"], steps:["Cuire le quinoa dans l'eau salée.","Mixer le quinoa cuit avec la betterave cuite pour obtenir une pâte homogène.","Étaler finement la pâte et cuire les galettes à la poêle pour former des wraps, puis garnir au choix."], tip:"Légende sans déroulé : étapes reconstituées a minima."},
{id:"chorba-vegetarienne", cat:"sale", name:"Chorba végétarienne (la chorba de Mamina)", time:"50 min", parts:"6 à 8", origin:"@franceinter", desc:"Une soupe originaire du Maghreb que François-Régis Gaudry adore, entièrement végétarienne — l'hommage personnel d'Amina Aissaoui (@amina_dieteticienne) à ses deux mamies algériennes, Yamina et Hanifa.", ingredients:["4 oignons","2 grosses tomates en été / 350 g de tomates entières pelées en hiver","2 gousses d'ail","200 g de pois chiches cuits","50 g de frik (blé vert concassé et torréfié, en épicerie orientale ou des Balkans, comme Heratchian)","2 branches de céleri","1 bouquet de coriandre","2 c. à soupe de paprika","1 c. à soupe de concentré de tomate","1,5 litre d'eau","Sel, poivre, huile d'olive"], steps:["Faire revenir les oignons grossièrement coupés dans l'huile d'olive avec le céleri grossièrement émincé, feuilles comprises.","Ajouter le bouquet de coriandre entier, les tomates émondées (ou fraîches grossièrement coupées) et le paprika. Saler généreusement et poivrer.","Au bout d'une dizaine de minutes, lorsque les ingrédients sont bien compotés, stopper la cuisson et mixer au mixeur plongeant — pas trop longtemps, le mélange doit encore contenir des morceaux.","Ajouter les pois chiches, le frik, le concentré de tomate et l'eau. Remettre le feu et laisser mijoter environ 30 minutes au premier frémissement, à découvert, en touillant de temps en temps.","Servir chaud, avec de la coriandre fraîche ou un filet de citron pour rehausser les saveurs."]},
{id:"oeufs-mayak", cat:"sale", name:"Œufs marinés façon coréenne (mayak gyeran)", time:"15 min + 1 nuit de marinade", parts:"4", origin:"@salutcestclaire", desc:"Des œufs mollets marinés toute la nuit dans une sauce soja-sésame, servis avec un bol de riz — la recette coréenne réconfortante.", ingredients:["4 œufs","10 cl de sauce soja salée (l'équivalent d'1/2 verre)","10 cl d'eau","2 oignons nouveaux","2 gousses d'ail","1 c. à soupe de miel","Graines de sésame","1 piment (facultatif)"], steps:["Cuire les œufs 6 minutes à partir de l'ébullition pour qu'ils soient mollets, puis les débarrasser dans un saladier rempli d'eau et de glaçons, puis les écaler (beaucoup plus facile avec cette technique).","Pendant que les œufs cuisent, découper finement les oignons nouveaux et l'ail, et verser dans un récipient avec la sauce soja, l'eau, le miel et les graines de sésame. Mélanger.","Ajouter les œufs écalés dans la marinade et les laisser mariner toute la nuit au frigo — voire plusieurs jours pour encore plus de goût.","Servir avec un bol de riz et des oignons crispy."], tip:"Dans la version traditionnelle, on ajoute du piment frais dans la marinade — perso je préfère sans."},
{id:"tourte-pommes-de-terre", cat:"sale", name:"Quick potato pie (tourte de pommes de terre)", time:"1 h 40", parts:"4", origin:"@mediterraneandiet.recipes", desc:"Une tourte express pommes de terre, mozzarella, épinards et œufs, façon régime méditerranéen.", ingredients:["4-5 pommes de terre","Huile d'olive","Sel, poivre","100 g de mozzarella (1 tasse)","8-9 tomates cerises","1 oignon rouge","Des épinards","3 œufs","2 c. à soupe de cream cheese","30 g de beurre","1/2 c. à café d'ail en poudre","50 ml de lait","Parmesan (pour servir)"], steps:["Badigeonner les pommes de terre d'huile et les enfourner 40 minutes à 200°C (convection). Les écraser ensuite dans un plat à gratin et les répartir uniformément. Saupoudrer de sel et de poivre, arroser d'huile, et enfourner encore 30 minutes à 200°C.","Placer la mozzarella, les tomates cerises, l'oignon rouge et les épinards au centre.","Dans un bol séparé, mélanger les œufs avec le cream cheese, le beurre, les épices et le lait.","Verser le mélange sur la tourte et cuire 30 minutes à 200°C. Au moment de servir, saupoudrer de parmesan."], tip:"By @chef_dmitriy_official."},
{id:"gyozas-legumes", cat:"sale", name:"Gyozas aux légumes", time:"1 h", parts:"Une trentaine de gyozas", origin:"@les_recettes_de_margaux", desc:"Les gyozas sont l'un de mes plats préférés ! Après cette vidéo vous n'aurez plus aucune excuse pour les acheter tout prêts — ici, la version légumes.", ingredients:["Pâte : 150 g de farine, 100 ml d'eau bouillante, 1 pincée de sel","Farce : 1 oignon rouge émincé, 3-4 gousses d'ail hachées, 2 carottes, 1/4 d'un petit chou, 1 poignée de champignons noirs déshydratés, 2 c. à soupe de sauce soja, huile de sésame, poivre, huile pimentée, graines de sésame, ciboulette"], steps:["Pour la farce : couper finement l'ensemble des légumes et les faire revenir dans de l'huile de sésame.","Réhydrater les champignons noirs 8 min dans de l'eau bouillante, les émincer et les ajouter aux légumes. Assaisonner avec la sauce soja et le poivre noir.","Pour la pâte : mélanger la farine, le sel et l'eau bouillante. Travailler la pâte 5-10 min à la main en ajoutant si nécessaire de la farine.","Étaler la pâte au rouleau fariné : elle doit être la plus fine possible, jusqu'à voir les doigts en transparence. Emporte-piècer des disques.","Déposer la farce au centre de chaque disque, humidifier le pourtour avec un peu d'eau, puis former les gyozas en croissant de lune : un point de pression au centre, 3 plis de chaque côté en pinçant pour sceller.","Chauffer une poêle avec de l'huile (idéalement de sésame), déposer les gyozas côté plat et cuire jusqu'à coloration (environ 3 min).","Ajouter un fond d'eau, couvrir 10 min jusqu'à ce que les gyozas soient cuits.","Servir avec des graines de sésame, de la ciboulette et de l'huile pimentée !"]},
{id:"pain-complet-poele", cat:"sale", name:"Pain complet maxi gonflé à la poêle", time:"45 min", parts:"4 pains", origin:"@belqisvl", desc:"Des petits pains complets à la poêle qui nécessitent très peu de temps de repos — le résultat est fou. À garnir selon tes envies !", ingredients:["130 g de farine (ici 80 g de farine de blé T150 et 50 g de farine de blé T65)","100 g de yaourt épais type skyr (végétal ou non)","1 c. à café de bicarbonate alimentaire","Optionnel : 1 pincée de sel"], steps:["Dans un saladier, mélanger tous les ingrédients (mettre TOUT le yaourt — racler bien pour avoir les 100 g pile).","Former une belle boule puis la pétrir 2 min. Laisser reposer 20 min.","Diviser la boule en 4. Aplatir chaque disque à l'aide d'un rouleau à pâtisserie et laisser reposer encore 20 min (sans les faire se chevaucher). Il ne faut pas que vos disques soient troués, pour qu'ils gonflent à la cuisson.","Dans une poêle bien chaude (feu à 7 sur 15 pour moi), sans huile, déposer les disques. Dès qu'ils commencent à faire des bulles, les retourner : ils vont commencer à gonfler ! (S'il ne gonfle pas, appuyer délicatement dessus à l'aide d'une spatule.)","Quand il a fini de gonfler, il est prêt. Laisser tiédir, couper une extrémité aux ciseaux, garnir et déguster !"]},
{id:"veloute-chou-rouge", cat:"sansgluten", name:"Purple velouté (chou rouge)", time:"35 min", parts:"4", origin:"@the_greenquest", desc:"1 légume = 3 recettes ! Voici la première : un velouté violet tout simple, pour ~12 repas au total avec le même chou.", ingredients:["800 g de chou rouge","600 g de pommes de terre","1 pomme","1 gousse d'ail","1 L d'eau","Sel","2 c. à soupe de vinaigre"], steps:["Mettre dans une cocotte le chou rouge, les pommes de terre, la pomme, l'ail, l'eau et le sel.","Cuire sur feu moyen pendant 30 min, puis mixer et ajouter le vinaigre.","Assaisonner et servir."]},
{id:"riz-complet-chou-rouge", cat:"sansgluten", name:"Plat complet riz, lentilles & chou rouge", time:"30 min", parts:"4", origin:"@the_greenquest", desc:"1 légume = 3 recettes ! La deuxième : un plat complet riz-lentilles-chou rouge aux cranberries, avec une sauce sésame.", ingredients:["200 g de riz (ici riz sauvage, mais ça sera mieux avec du riz lambda)","80 g de lentilles vertes","Un peu d'huile","Du vinaigre de vin rouge (pour déglacer)","450 g de chou rouge émincé","200 g de châtaignes","2 poignées de cranberries","Sauce sésame : tahini + jus de citron + eau + algues"], steps:["Dans une sauteuse, faire revenir le riz et les lentilles avec un peu d'huile. Déglacer avec un peu de vinaigre de vin rouge.","Selon le temps de cuisson de votre riz (20 min), ajouter directement le chou rouge émincé, les châtaignes et les cranberries. Couvrir d'eau et cuire à feu doux à couvert pendant 20-25 min. Saler, poivrer. (Si votre riz met une heure à cuire : couvrir d'eau riz + lentilles, mettre à cuire, puis ajouter le reste 20 min avant la fin.)","Servir avec la sauce sésame (tahini + jus de citron + eau + algues)."]},
{id:"salade-chou-rouge-vermicelles", cat:"sansgluten", name:"Salade chou rouge façon rouleau de printemps", time:"20 min", parts:"4", origin:"@the_greenquest", desc:"1 légume = 3 recettes ! La troisième : une salade croquante chou-carotte-persil-vermicelles, avec une sauce cacahuète.", ingredients:["2 paquets de vermicelles de haricots mungo","350 g de chou rouge émincé finement","300 g de carottes râpées","1 botte de persil","Sauce cacahuète : 3 (c. à soupe de) peanut butter + 2 (c. à soupe de) shoyu ou tamari + 1 (c. à soupe de) vinaigre de riz + eau"], steps:["Couvrir les vermicelles d'eau bouillante et attendre 10 min.","Mélanger le chou rouge, les carottes râpées et le persil.","Ajouter les vermicelles à la salade, napper de sauce cacahuète et mélanger."]},
{id:"tomates-farcies-quinoa-thon", cat:"sale", name:"Tomates farcies quinoa-thon (express)", time:"20 min", parts:"2", origin:"@ysalinediet", desc:"Des tomates farcies express et équilibrées, sans cuisson — les quantités sont à adapter à chaque personne.", ingredients:["2 grosses tomates (ou 3-4 petites)","Sel et poivre","200 g de quinoa cuit","1 échalote","Du persil frais","6 olives","50 g de fêta","200 g de thon","1/2 cuillère à café de moutarde","2 cuillères à soupe de vinaigre de framboise"], steps:["Couper le chapeau des tomates et les évider. Saler et poivrer.","Mélanger le quinoa cuit avec l'échalote, le persil, les olives, la fêta et le thon, assaisonné de moutarde et de vinaigre de framboise.","Farcir les tomates du mélange et servir."], tip:"Perso, il me restait de la farce : je l'ai mangée avec les tomates farcies."},
{id:"pdt-caramelisees-miel-soja", cat:"sale", name:"Pommes de terre caramélisées miel-soja", time:"30 min", parts:"2 à 3", origin:"@acha_happybody", desc:"Des petites pommes de terre caramélisées au miel et à la sauce soja, en accompagnement ou plat principal.", ingredients:["500 g de petites pommes de terre crues","Huile de sésame","3 gousses d'ail","250 ml d'eau","2-3 c. à soupe de miel","60 ml de sauce soja","Graines de sésame","Ciboulette (ou cébette)"], steps:["Laver les petites pommes de terre, les couper en six et les faire revenir dans un peu d'huile de sésame dans une poêle pendant environ 4 minutes.","Ajouter les gousses d'ail émincées et poursuivre la cuisson pendant 8 minutes, jusqu'à ce que les pommes de terre soient légèrement dorées.","Préparer un mélange d'eau, de miel et de sauce soja dans un bol. Verser ce mélange dans la poêle et laisser évaporer toute l'eau : les pommes de terre vont caraméliser.","Servir saupoudré de graines de sésame et de ciboulette ciselée."], tip:"Pas d'inquiétude si vous avez l'impression d'avoir mis trop d'eau : l'eau met juste un peu de temps à s'évaporer."},
{id:"croquettes-potimarron", cat:"sale", name:"Croquettes de potimarron", time:"1 h", parts:"Une petite dizaine", origin:"@lagrande_bouffe", desc:"Des croquettes fondantes de potimarron au cœur mozzarella, panées et frites.", ingredients:["1 potimarron","Une bonne rasade d'huile d'olive","5 gousses d'ail (moins si vous n'êtes pas aussi névrosé que moi de l'ail)","Sel, poivre","100 g de chapelure","Une grosse poignée de parmesan","De la mozzarella","De la farine","1 œuf"], steps:["Couper le chapeau et le derche de la courge, la découper en tranches et la déposer dans un plat allant au four avec l'huile d'olive, l'ail, le sel et le poivre.","Enfourner 45 minutes.","Écraser le potimarron à la fourchette (je laisse la peau, quand c'est cuit c'est très bon et puis ça m'arrange surtout).","Ajouter la chapilure et beaucoup de parmesan (une grosse poignée). En mélangeant, ça doit former une pâte — c'est normal que ça colle un peu aux doigts.","Pour former les croquettes : déposer une cuillère à soupe de pâte dans la main, l'aplatir un peu, mettre de la mozzarella au centre et refermer avec une autre cuillère de pâte. Former une boule.","Rouler les boules dans la farine, puis dans l'œuf, puis dans la chapelure.","Frire quelques minutes, juste le temps qu'elles soient bien dorées, et les laisser égoutter sur du papier absorbant."], tip:"Régale-toi bien, le sang."},
{id:"basboussa", cat:"sucre", name:"Basboussa (recette soudanaise de Hanane)", time:"50 min", parts:"8", origin:"@macuisineenthousiaste", desc:"J'ai rencontré Hanane lors d'un atelier cuisine soudanaise à Lille : le basboussa est à base de semoule moyenne, genre celle qu'on met pour le couscous — je trouve ça fou et en même temps c'est tellement incroyable.", ingredients:["1 tasse de semoule moyenne (la même que pour ton couscous)","1 tasse de farine","1 tasse de noix de coco","1 tasse de sucre","1 c. à café de levure chimique","1 tasse de beurre fondu","1 tasse de fromage blanc","2 œufs","Sirop : 3 tasses d'eau, 1,5 tasse de sucre, un peu de vanille et de fleur d'oranger (facultatif)"], steps:["Mélanger les éléments secs et les éléments liquides séparément, puis tout mélanger ensemble.","Cuire au four (température non précisée dans la légende).","Pour le sirop : faire bouillir l'eau, le sucre, la vanille et la fleur d'oranger pendant 10-15 minutes et laisser tiédir, puis napper le basboussa du sirop."], tip:"Légende sans déroulé complet (pas de temps/température de cuisson indiqués) : version reconstituée a minima."},
{id:"bounty-express", cat:"sucre", name:"Bounty express", time:"20 min", parts:"10 bouchées", origin:"@thefattyferia", desc:"Cette recette est addictive et elle ne contient pas de lait concentré sucré.", ingredients:["120 g de crème de coco","100 g de coco râpée","40 g de sucre glace","200 g de chocolat pâtissier au lait"], steps:["Mélanger la crème de coco, la coco râpée et le sucre glace pour former la garniture coco.","Façonner des petits boudins et les laisser raffermir un peu.","Enrober de chocolat au lait fondu et laisser figer."], tip:"Légende sans déroulé : étapes reconstituées a minima."},
{id:"negimiso", cat:"sale", name:"Negimiso (confiture de verts de poireau)", time:"15 min", parts:"1 pot", origin:"@mado.jp", desc:"Vous avez déjà goûté le negimiso ? C'est une sauce japonaise parfaite pour des recettes anti-gaspi, avec les verts de poireau.", ingredients:["3 verts de poireau","100 g de pâte de miso","4 c. à soupe de mirin","4 c. à soupe de saké","2 à 4 c. à soupe de sucre (selon les goûts)","1 c. à café de gingembre râpé"], steps:["Cuire à feu doux les verts de poireau émincés avec la pâte de miso, le mirin, le saké, le sucre et le gingembre râpé, jusqu'à obtenir une confiture fondante."], tip:"Se conserve 1 semaine au frigo. Légende sans déroulé : étape reconstituée a minima."},
{id:"iles-flottantes", cat:"sucre", name:"Îles flottantes (chef Etchebest)", time:"55 min", parts:"4 à 6", origin:"@franceinter", desc:"Jusqu'ici la recette était tenue secrète, mais pour « On va déguster », @chef.etchebest a lâché la recette de ses îles flottantes.", ingredients:["5 œufs","20 g de sucre en poudre","Crème anglaise : 60 g de sucre en poudre, 25 cl de lait, 25 cl de crème liquide, 1 c. à café de vanille naturelle en poudre","Caramel : 80 g de sucre en poudre, 3 cl d'eau"], steps:["Clarifier les œufs : verser les blancs dans un cul de poule ou le bol d'un batteur.","Réaliser la crème anglaise avec les jaunes, la verser dans un plat creux de service allant au four et la réserver au frais.","Réaliser le caramel, puis le verser dans le fond d'un récipient allant au four.","Le jour J, monter les blancs en neige. À la fin, ajouter le sucre et fouetter à vitesse rapide pour les serrer.","Préchauffer le four à 180°C (th. 6). Verser de l'eau bouillante dans un plat un peu plus grand que celui contenant le caramel. Poser un cercle ou des emporte-pièces sur le caramel, puis y déposer les blancs en neige. Lisser la surface, placer le plat dans celui avec l'eau bouillante.","Enfourner environ 6 à 8 min au bain-marie en surveillant : dès que les îles doublent de volume, elles sont prêtes ! Retourner les blancs cuits et les démouler sur la crème anglaise."], tip:"Astuce : si vous êtes pressé et que vous avez un micro-ondes, mettez-y vos blancs en neige à cuire 5 minutes — le résultat est bluffant. Accord mets/vins : champagne brut."},
{id:"napolitain-vegan", cat:"sucre", name:"Napolitain vegan", time:"1 h", parts:"8 à 10", origin:"@vegranola", desc:"On a l'impression que les jolis gâteaux à plusieurs couches sont compliqués à faire — ça ne s'applique vraiment pas au napolitain. Le truc le plus long ici ? Le montage !", ingredients:["190 g de yaourt de soja nature","250 g de lait de soja vanille","150 g de sucre","1 c. à café de vinaigre de cidre ou de jus de citron","300 g de farine de blé T55 ou 65","1 sachet de levure chimique","60 g d'huile neutre","1 c. à café de vanille + 15 g de cacao","Ganache : 100 g de chocolat pâtissier, 100 g de crème de soja fluide","Glaçage : 100 g de sucre glace, un peu d'eau"], steps:["Préparer la génoise : dans un saladier, mélanger le yaourt de soja avec le lait, le sucre et le vinaigre.","Ajouter la farine et la levure, mélanger au fouet, puis ajouter l'huile et mélanger jusqu'à incorporation.","Peser la pâte (elle doit faire environ 900 g) : diviser en 2/3 (vanille) et 1/3 (chocolat).","Ajouter la vanille dans la plus grosse quantité de pâte et le cacao dans le tiers restant.","Sur une plaque, déposer un papier sulfurisé sur 2/3 et un autre sur le tiers restant (penser à mesurer !), en les faisant remonter l'un contre l'autre pour que les pâtes n'entrent pas en contact.","Verser la pâte vanille sur le grand papier et la chocolat sur le petit. Enfourner 15 min à 180°C.","Préparer la ganache : faire fondre le chocolat avec la crème de soja au bain-marie et mélanger jusqu'à texture homogène. Réserver.","Préparer le glaçage : mélanger le sucre glace avec à peine quelques gouttes d'eau : il doit être épais et nappant, bien blanc. Réserver.","Une fois les génoises refroidies, découper la génoise vanille en deux parts égales pour qu'elles aient la même taille que celle au chocolat.","Montage : déposer une génoise vanille sur une planche, étaler la moitié de la ganache sur toute la surface.","Ajouter la génoise chocolat, le restant de ganache, étaler et terminer par la génoise vanille.","Napper le dessus du glaçage blanc, lisser et laisser figer."], tip:"Les étapes 1-11 viennent de la légende, la fin (glaçage) du commentaire épinglé du post."},
{id:"cornichons-burger-pickles", cat:"sansgluten", name:"Cornichons burger (pickles)", time:"15 min + 4-5 h de repos", parts:"1 bocal", origin:"@nabil_zemmouri", desc:"Bluffant à quel point c'est meilleur en goût et en texture que les cornichons burger du commerce : bien plus croquants et parfumés.", ingredients:["Des concombres (ou cornichons)","Du vinaigre (pour moi du balsamique blanc, mais cidre ou vinaigre de riz feront l'affaire)","De l'aneth (3 ou 4 petites branches)","Du fenouil en graines","Des baies rouges (ou des grains de poivre noir)","Sel"], steps:["Couper les rondelles ni trop fines ni trop épaisses — vraiment comme les cornichons classiques, donc 1 millimètre.","Faire bien bouillir la préparation (vinaigre + aromates) et verser la bouillante dans le bocal.","Attendre 4 ou 5 heures pour déguster, ou mieux le lendemain — mais jamais chaud."], tip:"Conservation 2 à 3 semaines au frigo, et de réelles économies. La saumure exacte (sel/sucre) n'est pas précisée dans la légende."},
{id:"cantucci-di-prato", cat:"sucre", name:"Cantucci di Prato", time:"50 min", parts:"Une trentaine de biscotti", origin:"@chunky_cooker", desc:"Les cantucci di Prato : les biscotti italiens aux amandes entières.", ingredients:["300 g de farine","60 g de beurre","215 g de sucre","2 œufs","6 g de levure chimique","1 pincée de sel","125 g d'amandes entières"], steps:["Mélanger farine, beurre, sucre, œufs, levure et sel.","Incorporer les amandes entières et former des boudins.","Cuire, trancher les boudins en biscotti et les recuire pour les faire sécher (méthode biscotti classique)."], tip:"Légende sans déroulé (liste d'ingrédients seule, en 5 langues) : étapes reconstituées a minima."},
{id:"tarte-abricot-guerard", cat:"sucre", name:"Tarte à l'abricot de Michel Guérard", time:"1 h 30", parts:"8", origin:"@franceinter", desc:"J'ai mangé la meilleure recette de tarte à l'abricot de ma vie à la table de Michel Guérard, aux Prés d'Eugénie — bien beurrée, bien sablée, parfaitement équilibrée. La recette soufflée par son chef Hugo Souchet.", ingredients:["1 kg d'abricots de Provence","Pâte à tarte : 350 g de farine, 180 g de beurre, 80 g de sucre, 8 g de sel, 2 jaunes d'œuf","Sirop de pochage : 2 L d'eau, 200 g de sucre, 100 g de jus de citron jaune","Beurre romarin : 100 g de beurre, 1 branche de romarin","Divers : pincées de sucre blanc ou cassonade, 15 g d'amandes effilées, zeste de citron jaune, 1 jaune d'œuf (dorure)"], steps:["Pocher les abricots dans le sirop (eau + sucre + jus de citron).","Réaliser la pâte à tarte (farine, beurre, sucre, sel, jaunes), la foncer et la précuire à blanc.","Monter la tarte : beurre au romarin, abricots pochés, amandes effilées, sucre, zeste, dorure au jaune d'œuf, et cuire jusqu'à belle coloration."], tip:"Légende sans déroulé (liste d'ingrédients complète seulement) : étapes reconstituées a minima."},
{id:"egg-and-cress", cat:"sale", name:"Egg and cress sandwich", time:"20 min", parts:"2 à 3", origin:"@franceinter", desc:"Un aller-retour dans la capitale anglaise : entre le moelleux du pain de mie, la mayonnaise réconfortante et les œufs durs mêlés au côté herbacé du cresson, ce sandwich végé est une bonne alternative déjeuner au jambon-beurre — tout droit de L'Entente, la plus British des brasseries parisiennes.", ingredients:["4 œufs","Beurre doux","2 c. à soupe d'une mayonnaise bien relevée","1/2 c. à café de poudre de curry","1/2 bouquet de cresson","8 tranches de pain blanc","Moulin à poivre"], steps:["Mettre les œufs dans une casserole d'eau froide, porter à ébullition puis laisser mijoter 4 minutes. Égoutter, passer sous l'eau froide et retirer la coquille.","Dans un saladier, écraser les œufs à la fourchette en veillant à laisser des morceaux.","Hacher finement le cresson, l'ajouter aux œufs, puis incorporer le reste des ingrédients (mayonnaise, curry, beurre). Bien mélanger à la spatule.","Enlever les croûtes des tranches de pain de mie.","Beurrer légèrement les tranches, bien répartir le mélange d'œufs sur une seule des deux, ajouter un tour de moulin à poivre, puis recouvrir de l'autre tranche.","Couper le sandwich en deux en diagonale pour former des triangles."], tip:"Une egg-cellente recette."},
{id:"fuelan-chocolat", cat:"sucre", name:"Fuelan au chocolat", time:"35 min", parts:"8", origin:"@franceinter", desc:"Entre fondant et moelleux, impossible de choisir ? Le fuelan est le mix parfait entre les bords croûtés du fondant et le cœur coulant du moelleux — goûté chez @traiteurmamiche, inventé par un groupe de Lyonnaises. Attention, il est affolant !", ingredients:["1 plaquette de 200 g de chocolat noir","1 plaquette de 250 g de beurre demi-sel","190 g de sucre glace","5 œufs frais","1 pincée de fleur de sel"], steps:["Préchauffer le four à 200°C. Dans une grande casserole, faire fondre le beurre. Éteindre le feu, ajouter le chocolat en morceaux et mélanger.","Verser le mélange dans un cul de poule et ajouter les œufs. Bien mélanger.","Ajouter le sucre glace et bien mélanger au fouet.","Beurrer un moule à tarte de 24 cm, y verser la préparation et parsemer une petite pincée de fleur de sel sur le dessus.","Cuire 20 minutes à 200°C. Se mange tiède à la cuillère."]},
{id:"nouilles-sesame", cat:"sansgluten", name:"Nouilles sauce sésame (sans cuisson)", time:"10 min", parts:"1 à 2", origin:"@lherboristecuisinevege", desc:"Des nouilles froides sauce sésame-tahini, sans cuisson, avec tofu fumé et cacahuètes.", ingredients:["Sauce : 1 c. à soupe de tahini ou purée de cacahuète, 1 c. à café de sauce soja, 1 pincée d'ail, d'oignon et de poivre, 1/4 c. à café de bouillon en poudre (ou miso, ssamjang…), quelques c. à soupe d'eau","1 à 2 nids de nouilles de riz, selon votre faim","Oignons verts","Tofu fumé","Cacahuètes"], steps:["Réhydrater les nouilles de riz.","Mélanger la sauce (ajuster l'eau pour une texture nappante).","Ajouter les nouilles, les oignons verts, le tofu fumé et les cacahuètes. Bon appétit les petits !"]},
{id:"cheesecake-sale-bretzel", cat:"sale", name:"Cheesecake salé bretzel-basilic (en verre)", time:"15 min + 2 h au frais", parts:"4 verres", origin:"@healthy.lalou", desc:"Miamiam & colo : rien de mega fancy (j'avoue, la veille au soir je me suis dit vazy j'ai quoi dans le frigo) mais c'était joli et bon, et c'est ça qu'on veut.", ingredients:["400 g de yaourt végétal à la grecque","Le jus et le zeste de 1/2 citron","Une petite poignée de basilic (+ des queues de persil)","Des bretzels mixés (à mélanger avec des noix)","Tomates, sel, poivre, huile d'olive, crème de balsamique, potite feuille de basilic (dressage)"], steps:["Mélanger le yaourt végétal avec le jus et le zeste du demi-citron.","Mixer la moitié de ce mélange avec la petite poignée de basilic (et les queues de persil) : on obtient un yaourt blanc et un yaourt vert.","Dans des verres (ou des cercles à entremets si tu veux démouler), déposer des bretzels mixés (mélangés avec des noix), puis alterner les cuillères de yaourt blanc et vert.","Mettre au frais minimum 2 h — la veille c'est encore mieux.","Au moment de servir : des tomates dessus, sel, poivre, huile d'olive, crème de balsamique, potite feuille de basilic — et voilà, c'est bon et c'est frais."]},
{id:"brochettes-courgettes-gochujang", cat:"sansgluten", name:"Brochettes de courgettes sauce gochujang, riz & tofu fumé", time:"20 min", parts:"2", origin:"@healthy.lalou", desc:"Des lamelles de courgettes grillées à la brochette, sauce gochujang-ail-gingembre, servies sur riz avec du tofu fumé.", ingredients:["2 courgettes","Sauce : 1 c. à café de gochujang, 1 gousse d'ail râpée, 1 cm de gingembre frais râpé, 1/2 verre d'eau","Alternatives sauce : moutarde + sirop d'érable, concentré de tomate, cumin, paprika, origan… y'a plein de folies à faire","Du riz","Du tofu fumé (c'est le Taifun, ma vie ce truc)","Poivre, sésame, tahini"], steps:["Prendre 2 courgettes, faire des lamelles avec un économe et les monter joliment sur des brochettes.","Cuire à feu vif — faut que ça crame un peu, genre quelques minutes de chaque côté.","Ajouter la sauce (gochujang, ail, gingembre dilués dans l'eau).","Servir sur du riz, avec le tofu fumé, du poivre, du sésame et du tahini. Voilaaa."]},
{id:"clafoutis-abricots-vegan", cat:"sucre", name:"Clafoutis abricots vegan", time:"1 h 10", parts:"6 à 8", origin:"@healthy.lalou", desc:"Le dessert de l'été : un clafoutis vegan aux abricots, servi avec sa croûte caramélisée cassante.", ingredients:["800 g d'abricots","250 g de farine T55","4,5 cl d'huile neutre","60 cl de lait végétal vanille (déjà sucré, donc je sucre pas plus)","Sucre blanc + chalumeau (finition)"], steps:["Mélanger la farine, l'huile et le lait végétal vanille.","Ajouter les abricots et verser dans un moule.","Cuire environ 1 h à 180°C.","Ajouter du sucre blanc sur le dessus et caraméliser au chalumeau — servir direct si tu veux que la croûte caramélisée soit bien cassante."]},
{id:"cordon-bleu-butternut", cat:"sale", name:"Cordon bleu de courge butternut", time:"40 min", parts:"4", origin:"@cucinamammaela", desc:"Sono sicura che avec cette recette vous aimerez encore plus la courge — même ceux qui ne l'aiment pas tant vont se récrier : des cordons bleus de butternut au fromage et prosciutto.", ingredients:["1 courge butternut","1/2 œufs battus (traduit de l'italien : de l'œuf battu)","Fromage (quantité au choix)","Prosciutto (quantité au choix)","Chapelure (quantité au choix)","Sel, poivre, huile"], steps:["Couper des tranches de courge pas trop épaisses, les blanchir dans l'eau environ 5 minutes et les égoutter.","Sur chaque tranche, déposer au centre un peu de fromage et de prosciutto, puis fermer avec une autre tranche de courge.","Passer dans l'œuf battu, puis dans la chapelure.","Cuire à la poêle avec un filet d'huile — ou au four à 180°C pendant environ 20 minutes."], tip:"Traduit de l'italien."},
{id:"cauliflower-steak-chimichurri", cat:"sale", name:"Cauliflower steak + chimichurri", time:"40 min", parts:"2", origin:"@alfiecooks", desc:"Ma façon préférée de cuisiner le chou-fleur : en steaks, servis avec un chimichurri et une purée de butter beans. Ça sonne fancy, mais c'est super facile et 100 % végétal.", ingredients:["2 steaks de chou-fleur (d'un gros chou-fleur)","1 c. à soupe de paprika fumé","3 gousses d'ail","2 c. à soupe de beurre","Sel, poivre, huile d'olive","Chimichurri : un gros bouquet de persil, 1 gousse d'ail, 1 piment rouge, 2 c. à soupe de vinaigre de vin rouge, 100 ml d'huile d'olive extra vierge, sel, poivre","Purée de butter beans : 700 g de haricots butter en bocal, 1 citron, 1 gousse d'ail, 2 c. à soupe de levure nutritionnelle, sel, poivre"], steps:["D'abord, le chimichurri : hacher finement le persil, le déposer dans un bol. Émincer finement le piment, presser l'ail, ajouter aux herbes avec le vinaigre. Assaisonner, puis verser l'huile d'olive en filet en mélangeant. Réserver.","Les butter beans : tout verser dans un blender avec le jus de citron, le sel, le poivre, 1 gousse d'ail et la levure nutritionnelle.","Le chou-fleur : le découper en steaks — on doit pouvoir en obtenir deux du milieu d'un gros. Garder les extra florets pour une autre recette, ou les rôtir avec sel, poivre, paprika et huile pour servir à côté.","Hacher les feuilles et tiges, réserver pour une garniture zéro déchet.","Assaisonner les steaks de sel, poivre et paprika des deux côtés, puis les arroser d'huile et bien masser.","Chauffer une poêle à feu moyen-vif avec 2 c. à soupe d'huile d'olive. Une fois chaude, déposer le steak et presser pour bien saisir. Après plusieurs minutes, retourner et frire l'autre face jusqu'à couleur dorée.","Écraser les gousses d'ail, les ajouter avec le beurre et arroser continuellement. Une fois les steaks cuits, les retirer, puis ajouter les feuilles/tiges hachées avec un filet d'huile et cuire jusqu'à ce qu'elles soient dorées et croustillantes.","Servir : verser la purée de butter beans au milieu de l'assiette, poser le steak dessus, napper de chimichurri et parsemer des feuilles de chou-fleur."], tip:"Traduit de l'anglais."},
{id:"chocolat-chaud", cat:"sucre", name:"Chocolat chaud (twist de François-Régis Gaudry)", time:"10 min", parts:"4 belles tasses", origin:"@franceinter", desc:"Les secrets du péché mignon de @frgaudry : le chocolat chaud de Perla Servan-Schreiber, avec un petit twist délicieux (une cuillère de café noir).", ingredients:["25 cl de lait entier","25 cl de crème liquide","100 g de chocolat noir à 75 % de cacao","50 g de chocolat au lait","1 c. à soupe de cacao en poudre","Un peu de sucre en poudre (selon votre goût)","1 c. à soupe de café noir"], steps:["Faire chauffer le lait et la crème.","Ajouter les chocolats, le cacao en poudre, le sucre et le café noir, et fouetter jusqu'à une texture bien lisse et mousseuse."], tip:"Légende sans déroulé : étapes reconstituées a minima."},
{id:"bouillon-legumes-poudre", cat:"sansgluten", name:"Bouillon de légumes en poudre maison", time:"10 min", parts:"1 bocal", origin:"@le.renard.et.les.raisins", desc:"1 c. à soupe de ce bouillon maison = 1 cube du commerce. S'utilise dans absolument toutes les recettes, et même en consommé.", ingredients:["100 g de levure maltée ou autre levure nutritionnelle sans gluten","30 g de sel","10 g d'oignons en poudre","1 c. à café bombée d'ail en poudre","10 g de poudre de champignon (facultatif)","20 g d'un mélange d'herbes séchées « assaisonnement pour salades » OU 10 g de persil séché + 10 g de ciboulette séchée + 1 pincée de paprika fumé ou doux","3/4 de c. à café de curcuma","1/2 c. à café de piment en poudre","1/2 c. à café de muscade râpée","1/2 c. à café de gingembre en poudre","1/2 c. à café de poivre moulu noir ou blanc"], steps:["Tout mixer en poudre fine.","Conserver dans un bocal hermétique."], tip:"Erratum du post : la science n'a jamais prouvé que le glutamate était nocif — la pensée populaire n'aurait aucun fondement."},
{id:"butternut-hasselback", cat:"sale", name:"Butternut hasselback", time:"1 h 10", parts:"2 à 3", origin:"@healthy.lalou", desc:"Tout simple à faire et hyper bon — ça passe crème pour un date ou une soirée solo devant Netflix, héhé.", ingredients:["1 butternut","Marinade : 3 c. à soupe d'huile, 1 c. à café d'origan, 1 c. à café de paprika, 1 c. à café de cumin (mais en soi tu peux mettre ce que tu veux)","Sauce : 1 c. à café de moutarde + 2 c. à soupe de crème végétale + 1 c. à café de sirop d'érable + poivre noir","Service : pousses d'épinards, granola salé, noix de Pécan, huile de noisette"], steps:["Couper le butternut en 2, enlever les graines, puis trancher en hasselback avec 2 baguettes placées de chaque côté pour ne pas aller au bout.","Lui faire gentiment un massage avec la marinade, puis 1 h à 200°C.","Mélanger la sauce (moutarde, crème végétale, sirop d'érable, poivre noir).","Servir avec les pousses d'épinards, le granola salé, les noix de Pécan et l'huile de noisette."]},
{id:"pate-a-crepes-pain-rassis", cat:"sucre", name:"Pâte à crêpes anti-gaspi au pain rassis", time:"10 min + repos", parts:"~15 crêpes", origin:"@nabil_zemmouri", desc:"L'idée est née en goûtant un excellent pain au cacao de la veille : une pâte à crêpe à base de pain rassis mixé, après plusieurs essais voici le dosage optimal et sa meilleure technique de cuisson.", ingredients:["100 g de pain rassis","400 ml de lait","2 œufs","20 g de beurre fondu","(1 c. à soupe de sucre dans le cas d'une pâte à crêpe sucrée, puis ce que vous aimez habituellement dedans)"], steps:["Mixer quelques minutes au blender : nul besoin de filtrer, mais il faut bien mixer.","Cuire sur feu plutôt fort au début, puis ne pas laisser brûler et passer à feu moyen jusqu'à ce que la crêpe se détache — compter 2 à 3 minutes de plus qu'une crêpe classique.","Nul besoin de la retourner : la farine provient du pain, elle est déjà cuite. Comme sur la crêpe mille trous, la cuisson se fait d'un seul côté — on obtient la parfaite combinaison des deux crêpes."], tip:"Version chocolat : ajouter 2 c. à café d'eau de fleur d'oranger."},
{id:"cake-marbre", cat:"sucre", name:"Cake marbré", time:"15 min + 45-50 min de cuisson", parts:"6", origin:"@franceinter", desc:"Le cake marbré, ou le gâteau qui met petits et grands d'accord pour le goûter !", ingredients:["225 g de beurre doux","255 g de sucre glace","1 c. à soupe de miel (soit 25 g)","5 œufs","290 g de farine T45","3 g de poudre à lever (1/3 de sachet)","1 pincée de sel","3 c. à café de cacao en poudre non sucré","(facultatif) 1 gousse de vanille grattée"], steps:["Préchauffer le four à 160°C, chaleur tournante.","Mélanger le beurre pommade et le sucre glace pour obtenir une texture homogène, puis le miel et bien mélanger.","Ajouter les œufs et mélanger, puis la farine, la poudre à lever, et terminer par le sel.","Séparer la pâte en deux, à vue d'œil, et ajouter le cacao dans l'une des deux afin d'obtenir une pâte cacaotée et une pâte nature.","Débarrasser les pâtes dans 2 poches à douille. Dans un moule préalablement chemisé, intercaler des boudins de pâtes cacaotées et natures.","À l'aide d'une pique, réaliser les marbrures puis enfourner 45-50 minutes à 160°C."], tip:"Recette d'Anthony Chenez, chef pâtissier des Sources de Caudalie à Martillac, réalisée par @frgaudry."},
{id:"concombre-farci-thon", cat:"sale", name:"Concombre farci au thon", time:"15 min", parts:"2", origin:"@zoeladiet", desc:"Grosse pépite quand tu as envie de fraîcheur et que tu ne sais pas quoi cuisiner ! Tu peux accompagner cette recette de pain pour un équilibre parfait.", ingredients:["1 concombre","2 petites boîtes de thon au naturel (150 à 200 g)","1 yaourt nature","1 c. à soupe de fromage frais nature","Le jus d'1/2 citron jaune","1 échalote","Sel, poivre, ciboulette"], steps:["Égoutter le thon, puis mélanger avec le yaourt, le fromage frais, le jus de citron et l'échalote ciselée. Assaisonner de sel, poivre et ciboulette.","Couper le concombre en tronçons (ou le moitié par moitié), les évider et garnir du mélange au thon. Servir bien frais."], tip:"Légende sans déroulé : étapes reconstituées a minima."},
{id:"gyozas-tofu", cat:"sale", name:"Gyozas au tofu (30-35 pièces)", time:"30 min", parts:"30-35 gyozas", origin:"@alonimhotep", desc:"Des gyozas 100 % veggie au tofu émietté, chou blanc, carotte et cébette — il suffit de mélanger, assaisonner, goûter et ajuster.", ingredients:["1 bloc de tofu (500 g)","1 carotte","1/2 chou blanc","Des oignons cébettes","2 gousses d'ail","1 pouce de gingembre","Sauce soja au goût","Huile de sésame au goût","1 c. à soupe de graines de sésame","1 c. à café de chili crisp ou de gochujang"], steps:["Émietter le tofu et mélanger avec le chou haché, l'ail, le gingembre et la carotte râpés, et les oignons cébettes. Assaisonner, goûter et ajuster si besoin.","Garnir les disques de gyozas et plier.","Dans une poêle huilée, cuire le dessous des gyozas quelques minutes, puis finir la cuisson en versant un peu d'eau et en couvrant quelques minutes."]},
{id:"pates-ciseaux-patate-douce", cat:"sale", name:"Pâtes aux ciseaux à la patate douce", time:"1 h 20", parts:"3 à 4", origin:"@le.renard.et.les.raisins", desc:"Des pâtes fraîches 2 ingrédients (patate douce + farine), coupées directement au-dessus de la casserole avec une paire de ciseaux — sans œuf, sans lait, végétariennes et vegan.", ingredients:["400 g de patate douce","360 g de farine de blé T45 ou T55","Sel","Facultatif : 1 c. à café de coriandre en poudre, de garam masala ou de curry ; margarine sans lait ou huile d'olive ; branches de romarin, thym ou sauge ; 2 gousses d'ail ; 2 échalotes ou 1 oignon rouge ; poivre"], steps:["Cuire au four à 180°C pendant 1 h une belle patate douce entière, lavée mais ni épluchée ni piquée.","Dans un saladier, mélanger à l'aide d'un presse-purée ou d'une fourchette la farine avec la chair pesée de la patate douce (sans la peau), 1/2 c. à café de sel et (facultatif) 1 c. à café d'épices. Une fois qu'une boule se forme, mélanger très brièvement à la main jusqu'à l'obtention d'une pâte à peu près homogène — il ne faut surtout pas pétrir.","Faire bouillir une grande quantité d'eau avec 1 c. à café de sel. Se placer avec le pâton au-dessus de la casserole et, à l'aide d'une paire de ciseaux enfarinée, couper des morceaux (enfariner les lames entre chaque coupe ou presque).","Laisser les pâtes remonter à la surface (environ 2-4 min de cuisson) puis les égoutter.","Dans une poêle sur feu moyen, faire fondre la margarine puis ajouter l'ail en tranches et les échalotes ciselées avec 1 pincée de sel et l'herbe choisie. Après 5 min, ajouter les pâtes et faire revenir 2 min. Servir immédiatement avec du poivre."]},
{id:"salade-mechouia", cat:"sale", name:"Salade mechouia", time:"1 h 20", parts:"4", origin:"@frgaudry", desc:"Une salade de légumes grillés qui sent bon l'été, extraite du livre « La cuisine Juive tunisienne de mère en fille » d'Andrée Zana Murat (Éditions Albin Michel, 1998).", ingredients:["4 poivrons (rouges et verts)","4 tomates","4 gousses d'ail","Un bon filet d'huile d'olive","1/2 c. à café de graines de coriandre","Le jus d'un demi-citron","1/4 d'écorce de citron confit","Quelques olives","1 c. à café de câpres","Sel et poivre"], steps:["Préchauffer le four en mode grill à 200°C.","Déposer sur une plaque chemisée les tomates, les poivrons et l'ail entier avec la peau.","Cuire pendant une bonne heure, en retournant la plaque pour qu'ils grillent de tous les côtés : la peau doit être bien noire et les légumes avoir pris un léger goût de brûlé.","Sortir les légumes du four et laisser reposer 10 minutes entre deux assiettes creuses (la peau s'enlève plus facilement). Ôter la peau puis hacher grossièrement les poivrons, les tomates et l'ail.","Verser dans un saladier et ajouter l'huile d'olive, les graines de coriandre moulues, un trait de jus de citron, les olives, l'écorce de citron confit découpée en dés et les câpres. Bien mélanger.","Rectifier l'assaisonnement, laisser refroidir puis placer au réfrigérateur. Servir bien frais."], tip:"Matériel : une plaque allant au four et un saladier."},

  // ---------- Rendu ----------
  const CATS = {
  sale: { label: "Salé", chipLabel: "🧂 Partie salée" },
  sucre: { label: "Sucré", chipLabel: "🍰 Partie sucrée" },
  sansgluten: { label: "Sans gluten", chipLabel: "🌾 Sans gluten" }
};
const grid = document.getElementById("grid");
const catTitle = document.getElementById("catTitle");
const empty = document.getElementById("empty");
const searchInput = document.getElementById("searchInput");
const count = document.getElementById("count");
let activeCat = "sale";
let activeTag = null;

function tagsHTML(r) {
  return `<div class="card-tags">${(TAGS[r.id] || []).map(t =>
    `<span class="tag-pill pill-${t === "végé" ? "vege" : t}">${t}</span>`).join("")}</div>`;
}

function cardHTML(r) {
  return `
    <article class="card" data-id="${r.id}" tabindex="0" role="button" aria-label="Ouvrir la recette ${r.name}">
      <div class="card-body">
        ${tagsHTML(r)}
        <h3>${r.name}</h3>
        <p class="desc">${r.desc}</p>
        <div class="meta">
          <span class="chip">⏱ ${r.time}</span>
          <span class="chip">🍽 ${r.parts}</span>
        </div>
      </div>
    </article>`;
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const list = RECETTES.filter(r => {
    const okCat = r.cat === activeCat;
    const okTag = !activeTag || (TAGS[r.id] || []).includes(activeTag);
    const text = (r.name + " " + r.desc + " " + r.origin + " " + r.ingredients.join(" ")).toLowerCase();
    return okCat && okTag && text.includes(q);
  });
  document.getElementById("tagfilters").style.display = activeCat === "sucre" ? "none" : "flex";
  catTitle.textContent = CATS[activeCat].label;
  grid.innerHTML = list.map(cardHTML).join("");
  count.textContent = list.length + (list.length > 1 ? " recettes" : " recette");
  if (!list.length) {
    empty.style.display = "block";
    empty.textContent = q
      ? "Aucune recette ne correspond à ta recherche 😕"
      : "Pas encore de recette ici — la section arrive bientôt 🌱";
  } else {
    empty.style.display = "none";
  }
}

// Filtres
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeCat = tab.dataset.cat;
    activeTag = null;
    document.querySelectorAll(".tagbtn").forEach(b => b.classList.remove("active"));
    render();
  });
});
document.querySelectorAll(".tagbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    activeTag = activeTag === btn.dataset.tag ? null : btn.dataset.tag;
    document.querySelectorAll(".tagbtn").forEach(b =>
      b.classList.toggle("active", b.dataset.tag === activeTag));
    render();
  });
});
searchInput.addEventListener("input", render);

// Modale
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");

function openRecipe(id) {
  const r = RECETTES.find(x => x.id === id);
  if (!r) return;
  modal.innerHTML = `
    <div class="modal-head ${r.cat}">
      <button class="close" aria-label="Fermer">✕</button>
      <h2>${r.name}</h2>
      <div class="origin">${r.origin}</div>
      <div class="modal-meta">
        <span class="chip">⏱ ${r.time}</span>
        <span class="chip">🍽 ${r.parts}</span>
        <span class="chip">${CATS[r.cat].chipLabel}</span>
        ${(TAGS[r.id] || []).map(t => `<span class="tag-pill pill-${t === "végé" ? "vege" : t}">${t}</span>`).join("")}
      </div>
    </div>
    <div class="modal-body">
      <div>
        <h3>Ingrédients</h3>
        <ul class="ingredients">
          ${r.ingredients.map(i => `<li><span class="box">✓</span><span>${i}</span></li>`).join("")}
        </ul>
      </div>
      <div>
        <h3>Préparation</h3>
        <ol class="steps">
          ${r.steps.map(s => `<li>${s}</li>`).join("")}
        </ol>
        ${r.tip ? `<div class="tip"><strong>Le truc en plus :</strong> ${r.tip}</div>` : ""}
      </div>
    </div>`;
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
  modal.querySelector(".close").addEventListener("click", closeRecipe);
  modal.querySelectorAll("ul.ingredients li").forEach(li => {
    li.addEventListener("click", () => li.classList.toggle("done"));
  });
}
function closeRecipe() {
  overlay.classList.remove("open");
  document.body.style.overflow = "";
}
overlay.addEventListener("click", e => { if (e.target === overlay) closeRecipe(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeRecipe(); });

// Clic sur les cartes (délégation)
grid.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) openRecipe(card.dataset.id);
});
grid.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    const card = e.target.closest(".card");
    if (card) { e.preventDefault(); openRecipe(card.dataset.id); }
  }
});

render();
  </script>
  </body>
</html>
